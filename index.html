<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КОВЕЛЬ: Стратегія</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #0f172a; color: #fff; }

        #update-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 2000;
            transition: opacity 0.5s ease;
        }
        .loader-content {
            text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #38bdf8;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-content h2 { color: #f8fafc; font-size: 22px; }
        .loader-content p { color: #94a3b8; font-size: 14px; }

        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e293b; display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: #334155; padding: 30px; border-radius: 12px; width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 15px;
        }
        .auth-box h2 { text-align: center; margin-bottom: 5px; color: #fff; }
        .auth-box input {
            padding: 12px; border-radius: 6px; border: 1px solid #475569;
            background: #1e293b; color: #fff; outline: none;
        }
        .auth-box button {
            padding: 12px; border-radius: 6px; border: none; background: #3b82f6;
            color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .auth-box button:hover { background: #2563eb; }
        .auth-toggle { text-align: center; font-size: 13px; color: #94a3b8; cursor: pointer; margin-top: 5px; }
        .auth-toggle:hover { color: #38bdf8; text-decoration: underline; }

        #game-container {
            display: none; height: 100vh; width: 100vw; flex-direction: column;
            justify-content: center; align-items: center; background: #0f172a; text-align: center; padding: 20px;
        }
        #game-container h1 { font-size: 28px; margin-bottom: 10px; color: #38bdf8; }
        #game-container p { color: #94a3b8; font-size: 16px; }
    </style>
</head>
<body>

    <div id="update-loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <h2 id="loader-status">Скидання до v1.0...</h2>
            <p id="loader-desc">Очищення старих механік та налаштування хмари</p>
        </div>
    </div>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Вхід у гру</h2>
            <input type="text" id="username" placeholder="Логін">
            <input type="password" id="password" placeholder="Пароль">
            <div id="new-password-container" style="display: none;">
                <input type="password" id="new-password" placeholder="Новий пароль" style="width: 100%; margin-top: 5px;">
            </div>
            <button id="auth-btn" onclick="handleAuth()">Увійти</button>
            <div class="auth-toggle" id="auth-toggle-mode" onclick="switchAuthMode('register')">Ще немає акаунта? Зареєструватись</div>
            <div class="auth-toggle" id="auth-toggle-pass" onclick="switchAuthMode('change-pass')" style="color: #64748b;">Змінити пароль</div>
        </div>
    </div>

    <div id="game-container">
        <h1 id="welcome-title">Вітаємо у грі!</h1>
        <p id="welcome-user"></p>
        <button onclick="logout()" style="margin-top: 20px; padding: 10px 20px; border-radius: 6px; border: none; background: #ef4444; color: #fff; cursor: pointer; font-weight: bold;">Вийти з акаунта</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrQeerlWPJ0d_gZ3acvW54FQmihdAQqK4",
            authDomain: "kovel-game.firebaseapp.com",
            databaseURL: "https://kovel-game-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kovel-game",
            storageBucket: "kovel-game.firebasestorage.app",
            messagingSenderId: "1028978690479",
            appId: "1:1028978690479:web:c37e96a9b07175d325c75a",
            measurementId: "G-5LQ72T83R8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const analytics = getAnalytics(app);

        const CURRENT_VERSION = "1.0";
        let mode = "login"; // "login", "register", "change-pass"

        window.addEventListener('load', () => {
            setTimeout(() => { hideLoader(); }, 800);
            setInterval(checkAutoUpdate, 15000);
        });

        function hideLoader() {
            const loader = document.getElementById('update-loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        function showUpdateScreen() {
            const loader = document.getElementById('update-loader');
            document.getElementById('loader-status').innerText = "Оновлення системи v1.0!";
            document.getElementById('loader-desc').innerText = "Перезавантаження конфігурації...";
            loader.style.display = 'flex';
            loader.style.opacity = '1';
        }

        function checkAutoUpdate() {
            fetch(window.location.href + '?t=' + new Date().getTime(), { cache: "no-store" })
            .then(response => response.text())
            .then(html => {
                const match = html.match(/const CURRENT_VERSION = "([^"]+)";/);
                if (match && match[1] && match[1] !== CURRENT_VERSION) {
                    showUpdateScreen();
                    setTimeout(() => { window.location.reload(true); }, 2000);
                }
            })
            .catch(err => {});
        }

        window.switchAuthMode = function(targetMode) {
            mode = targetMode;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('auth-btn');
            const toggleMode = document.getElementById('auth-toggle-mode');
            const togglePass = document.getElementById('auth-toggle-pass');
            const newPassContainer = document.getElementById('new-password-container');

            if (mode === 'login') {
                title.innerText = 'Вхід у гру';
                btn.innerText = 'Увійти';
                toggleMode.innerText = 'Ще немає акаунта? Зареєструватись';
                toggleMode.setAttribute('onclick', "switchAuthMode('register')");
                togglePass.style.display = 'block';
                newPassContainer.style.display = 'none';
            } else if (mode === 'register') {
                title.innerText = 'Реєстрація';
                btn.innerText = 'Створити акаунт';
                toggleMode.innerText = 'Вже є акаунт? Увійти';
                toggleMode.setAttribute('onclick', "switchAuthMode('login')");
                togglePass.style.display = 'none';
                newPassContainer.style.display = 'none';
            } else if (mode === 'change-pass') {
                title.innerText = 'Зміна пароля';
                btn.innerText = 'Змінити пароль';
                toggleMode.innerText = 'Повернутися до входу';
                toggleMode.setAttribute('onclick', "switchAuthMode('login')");
                togglePass.style.display = 'none';
                newPassContainer.style.display = 'block';
            }
        }

        window.handleAuth = async function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if(!user || !pass) {
                alert('Будь ласка, заповніть обовʼязкові поля!');
                return;
            }

            const dbRef = ref(db);

            try {
                if (mode === 'register') {
                    const snapshot = await get(child(dbRef, `users/${user}`));
                    if (snapshot.exists()) {
                        alert('Такий користувач вже існує!');
                        return;
                    }
                    await set(ref(db, 'users/' + user), { password: pass });
                    alert('Акаунт успішно створено!');
                    switchAuthMode('login');
                } 
                else if (mode === 'login') {
                    const snapshot = await get(child(dbRef, `users/${user}`));
                    if (!snapshot.exists() || snapshot.val().password !== pass) {
                        alert('Невірний логін або пароль!');
                        return;
                    }
                    
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('game-container').style.display = 'flex';
                    document.getElementById('welcome-user').innerText = `Користувач: ${user}`;
                } 
                else if (mode === 'change-pass') {
                    const newPass = document.getElementById('new-password').value.trim();
                    if (!newPass) {
                        alert('Введіть новий пароль!');
                        return;
                    }

                    const snapshot = await get(child(dbRef, `users/${user}`));
                    if (!snapshot.exists() || snapshot.val().password !== pass) {
                        alert('Невірний поточний логін або старий пароль!');
                        return;
                    }

                    await set(ref(db, 'users/' + user), { password: newPass });
                    alert('Пароль успішно змінено!');
                    document.getElementById('password').value = '';
                    document.getElementById('new-password').value = '';
                    switchAuthMode('login');
                }
            } catch (error) {
                alert('Помилка бази даних: ' + error.message);
            }
        }

        window.logout = function() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            switchAuthMode('login');
        }
    </script>
</body>
</html>
