// ===== КІНЕЦЬ ЧАСТИНИ 2/4 =====

                // ===== БІЙ ТА РУХ =====
        function stopTravel(unit) {
            const u = { ...unit, state: 'idle' };
            delete u.targetKey; delete u.arrivalTime; delete u.path; delete u.pathIndex; delete u.finalTargetKey;
            return u;
        }

        function findPath(startR, startC, targetR, targetC) {
            const startKey = `${startR}_${startC}`;
            const targetKey = `${targetR}_${targetC}`;
            if (startKey === targetKey) return [];
            const visited = new Set([startKey]);
            const queue = [{ r: startR, c: startC, path: [] }];
            let iterations = 0;
            const MAX_ITER = 20000;

            while (queue.length > 0 && iterations++ < MAX_ITER) {
                const { r, c, path } = queue.shift();
                for (const n of getNeighbors(r, c)) {
                    const key = n.key;
                    if (visited.has(key)) continue;
                    const h = hexWorldData[key];
                    if (h && h.type === 'chasm') continue;
                    if (key !== targetKey && isMyUnit(h)) continue;
                    visited.add(key);
                    const newPath = [...path, key];
                    if (key === targetKey) return newPath;
                    queue.push({ r: n.r, c: n.c, path: newPath });
                }
            }
            return null;
        }

        // ===== ЗОНА КОНТРОЛЮ =====
        function isHexInEnemyZOC(r, c) {
            const targetKey = `${r}_${c}`;
            const neighbors = getNeighbors(r, c);
            const checkHexes = [{ key: targetKey, r, c }, ...neighbors];

            for (const cell of checkHexes) {
                const h = hexWorldData[cell.key];
                if (!h) continue;
                if (!h.unit) continue;
                const unitOwner = h.unit.owner;
                if (!unitOwner) continue;
                if (unitOwner === currentUsername) continue;
                if (unitOwner === '__barbarian__') continue;
                return true;
            }

            for (const cell of checkHexes) {
                const h = hexWorldData[cell.key];
                if (!h) continue;
                if (h.type !== 'core') continue;
                const hexOwner = h.owner;
                if (!hexOwner) continue;
                if (hexOwner === currentUsername) continue;
                return true;
            }

            return false;
        }

        // =====================================================================
        // ХЕЛПЕРИ ДЛЯ БОЙОВОЇ ЛОГІКИ
        // =====================================================================

        function isHexOccupiedByUnit(key, ignoreUnitId) {
            const h = hexWorldData[key];
            if (!h || !h.unit) return false;
            if (ignoreUnitId && h.unit.id === ignoreUnitId) return false;
            return true;
        }

        function findFreeAdjacentHex(targetR, targetC, occupiedKeys) {
            const neighbors = getNeighbors(targetR, targetC);
            const shuffled = neighbors.slice().sort(() => Math.random() - 0.5);
            for (const n of shuffled) {
                const h = hexWorldData[n.key];
                if (h && h.type === 'chasm') continue;
                if (isHexOccupiedByUnit(n.key)) continue;
                if (occupiedKeys && occupiedKeys.has(n.key)) continue;
                return n.key;
            }
            return null;
        }

        function findWaitingHex(unit) {
            const path = unit.path || [];
            const idx = unit.pathIndex || 0;
            if (idx > 0 && path[idx - 1]) {
                const prevKey = path[idx - 1];
                if (!isHexOccupiedByUnit(prevKey, unit.id)) return prevKey;
            }
            const [r, c] = (unit.targetKey || '').split('_').map(Number);
            if (!isNaN(r) && !isNaN(c)) {
                return findFreeAdjacentHex(r, c, null);
            }
            return null;
        }

        function findAttackersOf(targetKey) {
            const result = [];
            Object.keys(hexWorldData).forEach(k => {
                const h = hexWorldData[k];
                if (!h || !h.unit) return;
                if (h.unit.owner !== currentUsername) return;
                if (h.unit.state !== 'fighting') return;
                if (h.unit.targetKey !== targetKey) return;
                result.push({ srcKey: k, unit: h.unit });
            });
            return result;
        }

        // =====================================================================
        // ХЕЛПЕРИ ДЛЯ ЗНИЩЕННЯ РАТУШІ (5.30.6)
        // =====================================================================

        // Знайти всіх воїнів вказаного власника на всій карті.
        // Повертає масив { srcKey, unit }.
        function findAllUnitsOfOwner(ownerName) {
            const result = [];
            Object.keys(hexWorldData).forEach(k => {
                const h = hexWorldData[k];
                if (!h || !h.unit) return;
                if (h.unit.owner !== ownerName) return;
                result.push({ srcKey: k, unit: h.unit });
            });
            return result;
        }

        // Обробити знищення ратуші. Викликається, коли HP ратуші впав до 0.
        // Повертає { goldReward, messages }.
        async function handleCoreDestroyed(targetKey, targetHex, attackerSrcKey, attackerUnit, isOffline) {
            const messages = [];
            const defenderOwner = targetHex.owner;
            const winnerOwner = attackerUnit.owner;

            // 1) Отримуємо свіже золото переможеного
            let rewardGold = 0;
            try {
                const gSnap = await get(ref(db, `users/${defenderOwner}/gold`));
                if (gSnap.exists()) {
                    const enemyGold = gSnap.val() || 0;
                    rewardGold = Math.floor(enemyGold * 0.5);
                }
            } catch (err) { console.error('Помилка отримання золота ворога:', err); }

            // 2) Гекс ратуші + 6 сусідів → переможцю (з будівлями та витратами/доходами)
            const newHexesForWinner = {};  // key → об'єкт гекса
            const [tr, tc] = targetKey.split('_').map(Number);
            const winnerColor = getPlayerColor(winnerOwner);

            // 2.1) Сам гекс ратуші → порожній (без unit), тип 'starter' бо ратуші вже немає
            newHexesForWinner[targetKey] = {
                owner: winnerOwner,
                color: winnerColor,
                type: 'starter',
                isPurchased: false
                // unit НЕ ставимо — його поставить атакуючий нижче
            };

            // 2.2) 6 сусідів → переможцю (зберігаючи тип, але прибираючи юніт)
            getNeighbors(tr, tc).forEach(n => {
                const nHex = hexWorldData[n.key];
                if (!nHex) return;
                if (nHex.type === 'chasm') return;
                newHexesForWinner[n.key] = {
                    owner: winnerOwner,
                    color: winnerColor,
                    type: nHex.type,  // зберігаємо farm/mill/starter/purchased/bridge
                    isPurchased: nHex.isPurchased || false,
                    level: nHex.level
                    // unit НЕ переносимо — ворожі воїни гинуть (див. нижче)
                };
            });

            // 3) ВБИВАЄМО ВСІХ воїнів переможеного гравця на ВСІЙ карті (12А)
            const defenderUnits = findAllUnitsOfOwner(defenderOwner);
            let killedCount = 0;
            defenderUnits.forEach(({ srcKey, unit }) => {
                // Якщо цей воїн стоїть на гексі, який щойно перейшов переможцю — гекс уже в newHexesForWinner без unit
                if (newHexesForWinner[srcKey]) return;  // вже очищено
                // Інакше — треба прибрати unit з цього гекса
                const h = hexWorldData[srcKey];
                if (!h) return;
                const cleaned = { ...h };
                delete cleaned.unit;
                newHexesForWinner[srcKey] = cleaned;
                killedCount++;
            });

            // 4) Воїн-захисник на самій ратуші (якщо був) — гине (А1)
            if (targetHex.unit) {
                // targetKey вже у newHexesForWinner без unit — все ок
                killedCount++;
            }

            // 5) Гекс ратуші займає атакуючий з найменшим pathIndex (1В)
            //    Знаходимо всіх, хто атакував цю ратушу
            const allAttackers = findAttackersOf(targetKey);
            // Додаємо поточного атакуючого, якщо він ще не в списку
            if (!allAttackers.some(a => a.unit.id === attackerUnit.id)) {
                allAttackers.push({ srcKey: attackerSrcKey, unit: attackerUnit });
            }
            // Сортуємо по pathIndex (хто перший почав — той перший)
            allAttackers.sort((a, b) => (a.unit.pathIndex || 0) - (b.unit.pathIndex || 0));
            const winnerAttacker = allAttackers[0];

            // Ставимо переможця на гекс ратуші
            const winnerUnit = stopTravel(winnerAttacker.unit);
            newHexesForWinner[targetKey].unit = winnerUnit;

            // 6) Інші атакуючі (крім переможця) — зупиняються на своїх місцях
            allAttackers.forEach(a => {
                if (a.unit.id === winnerAttacker.unit.id) return;
                if (newHexesForWinner[a.srcKey]) {
                    // гекс уже в списку — просто зупиняємо unit
                    if (newHexesForWinner[a.srcKey].unit && newHexesForWinner[a.srcKey].unit.id === a.unit.id) {
                        newHexesForWinner[a.srcKey].unit = stopTravel(a.unit);
                    }
                    return;
                }
                const h = hexWorldData[a.srcKey];
                if (!h) return;
                const updated = { ...h };
                updated.unit = stopTravel(a.unit);
                newHexesForWinner[a.srcKey] = updated;
            });

            // 7) Формуємо повідомлення
            messages.push(`🏰 Ратушу гравця ${defenderOwner} ЗНИЩЕНО!`);
            if (rewardGold > 0) messages.push(`💰 Трофей: +${rewardGold} золота (50% ворога)`);
            if (killedCount > 0) messages.push(`💀 Знищено воїнів ворога: ${killedCount}`);

            return { goldReward: rewardGold, messages, newHexes: newHexesForWinner, defenderOwner };
        }

        // =====================================================================
        // ГОЛОВНА ФУНКЦІЯ ОБРОБКИ ЮНІТІВ
        // =====================================================================
        async function processUnits(now, isOffline = false) {
            const hexUpdates = {};
            const messages = [];
            const processedUnits = new Set();
            let goldBonus = 0;
            // Окремо збираємо "знищені ратуші" — обробляємо їх ПІСЛЯ основного циклу
            const destroyedCores = [];  // { targetKey, targetHex, attackerSrcKey, attackerUnit }

            const getHex = (key) => (key in hexUpdates ? hexUpdates[key] : hexWorldData[key]);
            const setHex = (key, obj) => { if (obj === null) hexUpdates[key] = null; else hexUpdates[key] = obj; };

            // ===== КРОК 1: ЗБІР ПОДІЙ =====
            const events = [];
            Object.keys(hexWorldData).forEach(key => {
                const h = hexWorldData[key];
                if (!h || !h.unit) return;
                if (h.unit.owner !== currentUsername) return;
                const u = h.unit;
                if (u.state !== 'moving' && u.state !== 'fighting') return;
                if (!u.arrivalTime || now < u.arrivalTime) return;
                events.push({ srcKey: key, unit: u, arrival: u.arrivalTime });
            });
            events.sort((a, b) => a.arrival - b.arrival);

            // ===== КРОК 2: ОБРОБКА КОЖНОЇ ПОДІЇ =====
            for (const ev of events) {
                const { srcKey, unit: u0 } = ev;
                if (processedUnits.has(u0.id)) continue;

                const unit = u0;
                const targetKey = unit.targetKey;

                if (srcKey === targetKey) {
                    const h = { ...(getHex(srcKey) || {}) };
                    h.unit = stopTravel(unit);
                    setHex(srcKey, h);
                    processedUnits.add(unit.id);
                    continue;
                }

                let targetHex = getHex(targetKey);
                const targetUnit = targetHex ? targetHex.unit : null;

                // =============================================================
                // ФАЗА БОЮ (state === 'fighting')
                // =============================================================
                if (unit.state === 'fighting') {
                    // Якщо ціль — РАТУША (core), обробляємо окремо
                    if (targetHex && targetHex.type === 'core' && targetHex.owner && targetHex.owner !== currentUsername) {
                        // Збираємо всіх атакуючих цієї ратуші (з hexWorldData + поточний)
                        const allAttackers = findAttackersOf(targetKey);
                        if (!allAttackers.some(a => a.unit.id === unit.id)) {
                            allAttackers.push({ srcKey, unit });
                        }
                        // Додаємо тих, хто прибуває цього ж циклу (state 'moving', але прибув)
                        const arrivingAttackers = events.filter(e =>
                            e.unit.targetKey === targetKey &&
                            e.unit.state === 'moving' &&
                            !processedUnits.has(e.unit.id) &&
                            e.srcKey !== targetKey
                        );
                        arrivingAttackers.forEach(a => {
                            if (!allAttackers.some(x => x.unit.id === a.unit.id)) {
                                allAttackers.push({ srcKey: a.srcKey, unit: a.unit });
                            }
                        });

                        // Рахуємо сумарний урон по ратуші
                        let totalDmg = 0;
                        allAttackers.forEach(a => { totalDmg += a.unit.dmg; });

                        // Ратуша отримує урон
                        const coreHp = (targetHex.hp !== undefined ? targetHex.hp : getCoreMaxHp(targetHex.level || 1)) - totalDmg;
                        const coreLevel = targetHex.level || 1;
                        const coreDmg = getCoreDmg(coreLevel);

                        // Ратуша б'є У ВІДПОВІДЬ КОЖНОГО атакуючого (8Г)
                        allAttackers.forEach(a => {
                            const aSrcHex = getHex(a.srcKey);
                            if (!aSrcHex || !aSrcHex.unit || aSrcHex.unit.id !== a.unit.id) return;
                            const wounded = { ...aSrcHex.unit };
                            wounded.hp = (wounded.hp || 0) - coreDmg;
                            if (wounded.hp <= 0) {
                                // Воїн загинув
                                const cleaned = { ...aSrcHex };
                                delete cleaned.unit;
                                setHex(a.srcKey, cleaned);
                                messages.push(`💀 Ваш воїн загинув від удару ратуші!`);
                            } else {
                                const updated = { ...aSrcHex };
                                updated.unit = wounded;
                                setHex(a.srcKey, updated);
                            }
                            processedUnits.add(a.unit.id);
                        });

                        if (coreHp <= 0) {
                            // ===== РАТУША ЗНИЩЕНА =====
                            // Переможець — той, хто ПЕРШИЙ почав бій (найменший pathIndex)
                            allAttackers.sort((a, b) => (a.unit.pathIndex || 0) - (b.unit.pathIndex || 0));
                            const winnerAttacker = allAttackers[0];

                            // Обробляємо знищення ратуші (це асинхронна операція, бо читає золото ворога)
                            const result = await handleCoreDestroyed(
                                targetKey,
                                targetHex,
                                winnerAttacker.srcKey,
                                winnerAttacker.unit,
                                isOffline
                            );

                            // Записуємо всі нові гекси
                            Object.keys(result.newHexes).forEach(k => {
                                setHex(k, result.newHexes[k]);
                            });

                            // Додаємо трофей
                            goldBonus += result.goldReward;

                            // Додаємо повідомлення
                            result.messages.forEach(m => messages.push(m));

                            // Позначаємо ВСІХ атакуючих як оброблених (щоб не обробити їх двічі)
                            allAttackers.forEach(a => processedUnits.add(a.unit.id));
                            arrivingAttackers.forEach(a => processedUnits.add(a.unit.id));
                            continue;
                        } else {
                            // Ратуша ще жива — оновлюємо HP і продовжуємо бій
                            const updatedCore = { ...targetHex, hp: coreHp };
                            // Воїн-захисник (якщо є) — він теж б'є у відповідь? Поки ні,
                            // бо 4В говорить: захисник гине разом з ратушею. Але поки ратуша жива —
                            // захисник теж може бити. Поки що залишимо як "тільки ратуша б'є".
                            setHex(targetKey, updatedCore);

                            // Всі атакуючі продовжують бій через FIGHT_ROUND_MS
                            allAttackers.forEach(a => {
                                const aSrcHex = getHex(a.srcKey);
                                if (!aSrcHex || !aSrcHex.unit || aSrcHex.unit.id !== a.unit.id) return;
                                if (aSrcHex.unit.hp <= 0) return; // вже вбитий ратушею
                                const updated = { ...aSrcHex.unit };
                                updated.state = 'fighting';
                                updated.targetKey = targetKey;
                                updated.arrivalTime = isOffline ? (a.unit.arrivalTime + FIGHT_ROUND_MS) : (now + FIGHT_ROUND_MS);
                                const wrapper = { ...aSrcHex, unit: updated };
                                setHex(a.srcKey, wrapper);
                                processedUnits.add(a.unit.id);
                            });
                        }
                        continue;
                    }

                    // Якщо ціль — звичайний юніт
                    if (!targetHex || !targetUnit) {
                        const h = { ...(getHex(srcKey) || {}) };
                        h.unit = stopTravel(unit);
                        setHex(srcKey, h);
                        processedUnits.add(unit.id);
                        continue;
                    }

                    // ... (далі — існуюча логіка бою з варварами/воїнами, без змін)
                    const allAttackers = findAttackersOf(targetKey);
                    const arrivingAttackers = events.filter(e =>
                        e.unit.targetKey === targetKey &&
                        e.unit.state === 'moving' &&
                        !processedUnits.has(e.unit.id) &&
                        e.srcKey !== targetKey
                    );

                    const totalAttackersCount = allAttackers.length + arrivingAttackers.length;
                    if (totalAttackersCount > MAX_ATTACKERS) {
                        const waitKey = findWaitingHex(unit);
                        if (waitKey) {
                            const srcH = { ...(getHex(srcKey) || {}) };
                            delete srcH.unit;
                            setHex(srcKey, srcH);
                            const waitH = { ...(getHex(waitKey) || {}) };
                            waitH.unit = stopTravel(unit);
                            setHex(waitKey, waitH);
                        } else {
                            const h = { ...(getHex(srcKey) || {}) };
                            h.unit = stopTravel(unit);
                            setHex(srcKey, h);
                        }
                        processedUnits.add(unit.id);
                        continue;
                    }

                    let totalDmg = 0;
                    allAttackers.forEach(a => { totalDmg += a.unit.dmg; });
                    if (!allAttackers.some(a => a.unit.id === unit.id)) totalDmg += unit.dmg;
                    arrivingAttackers.forEach(a => { totalDmg += a.unit.dmg; });

                    const allForTarget = [
                        ...allAttackers,
                        { srcKey, unit },
                        ...arrivingAttackers.map(a => ({ srcKey: a.srcKey, unit: a.unit }))
                    ];
                    allForTarget.sort((a, b) => (a.unit.pathIndex || 0) - (b.unit.pathIndex || 0));
                    const victim = allForTarget[0];

                    const defender = { ...targetUnit };
                    const isCamp = targetHex.type === 'barbarian_camp';
                    defender.hp -= totalDmg;
                    if (isCamp) defender.lastCombat = now;

                    const victimDmg = defender.dmg || 0;
                    let victimNewHp = victim.unit.hp - victimDmg;

                    if (defender.hp <= 0 && victimNewHp <= 0) {
                        _killUnit(hexUpdates, victim.srcKey, victim.unit.id, getHex, setHex, messages);
                        if (isCamp) {
                            setHex(targetKey, null);
                        } else {
                            const tgtH = { ...(getHex(targetKey) || {}) };
                            delete tgtH.unit;
                            setHex(targetKey, tgtH);
                        }
                    } else if (defender.hp <= 0) {
                        if (isCamp) {
                            const reward = targetHex.reward || 100;
                            goldBonus += reward;
                            setHex(targetKey, {
                                owner: currentUsername,
                                color: getPlayerColor(currentUsername),
                                type: 'starter',
                                isPurchased: false
                            });
                            messages.push(`🎉 Табір зачищено! +${reward} золота`);
                        } else {
                            const winner = { ...victim.unit };
                            const vSrcH = { ...(getHex(victim.srcKey) || {}) };
                            delete vSrcH.unit;
                            setHex(victim.srcKey, vSrcH);
                            const tgtH = { ...(getHex(targetKey) || {}) };
                            tgtH.unit = stopTravel(winner);
                            setHex(targetKey, tgtH);
                        }

                        allForTarget.forEach(fighter => {
                            if (fighter.unit.id === victim.unit.id) return;
                            const fSrcH = { ...(getHex(fighter.srcKey) || {}) };
                            if (fSrcH.unit && fSrcH.unit.id === fighter.unit.id) {
                                fSrcH.unit = stopTravel(fighter.unit);
                                setHex(fighter.srcKey, fSrcH);
                                processedUnits.add(fighter.unit.id);
                            }
                        });
                        processedUnits.add(victim.unit.id);
                    } else if (victimNewHp <= 0) {
                        _killUnit(hexUpdates, victim.srcKey, victim.unit.id, getHex, setHex, messages);
                        const tgtH = { ...(getHex(targetKey) || {}) };
                        tgtH.unit = defender;
                        setHex(targetKey, tgtH);
                        allForTarget.forEach(fighter => {
                            if (fighter.unit.id === victim.unit.id) return;
                            const fSrcH = { ...(getHex(fighter.srcKey) || {}) };
                            if (fSrcH.unit && fSrcH.unit.id === fighter.unit.id) {
                                const fu = { ...fSrcH.unit };
                                fu.state = 'fighting';
                                fu.arrivalTime = isOffline ? (fu.arrivalTime + FIGHT_ROUND_MS) : (now + FIGHT_ROUND_MS);
                                fSrcH.unit = fu;
                                setHex(fighter.srcKey, fSrcH);
                                processedUnits.add(fighter.unit.id);
                            }
                        });
                    } else {
                        const tgtH = { ...(getHex(targetKey) || {}) };
                        tgtH.unit = defender;
                        setHex(targetKey, tgtH);

                        allForTarget.forEach(fighter => {
                            const fSrcH = { ...(getHex(fighter.srcKey) || {}) };
                            if (fSrcH.unit && fSrcH.unit.id === fighter.unit.id) {
                                const fu = { ...fSrcH.unit };
                                if (fighter.unit.id === victim.unit.id) fu.hp = victimNewHp;
                                fu.state = 'fighting';
                                fu.arrivalTime = isOffline ? (fu.arrivalTime + FIGHT_ROUND_MS) : (now + FIGHT_ROUND_MS);
                                fSrcH.unit = fu;
                                setHex(fighter.srcKey, fSrcH);
                                processedUnits.add(fighter.unit.id);
                            }
                        });
                    }
                    continue;
                }

                // =============================================================
                // ФАЗА РУХУ (state === 'moving')
                // =============================================================
                if (unit.state === 'moving') {
                    if (targetHex && targetHex.type === 'chasm') {
                        const h = { ...(getHex(srcKey) || {}) };
                        h.unit = stopTravel(unit);
                        setHex(srcKey, h);
                        processedUnits.add(unit.id);
                        continue;
                    }

                    // ЧУЖИЙ юніт на гексі → атака
                    if (targetUnit && targetUnit.owner !== currentUsername) {
                        const allAttackers = findAttackersOf(targetKey);
                        const arrivingAttackers = events.filter(e =>
                            e.unit.targetKey === targetKey &&
                            e.unit.state === 'moving' &&
                            !processedUnits.has(e.unit.id) &&
                            e.srcKey !== targetKey
                        );
                        if (allAttackers.length + arrivingAttackers.length > MAX_ATTACKERS) {
                            const waitKey = findWaitingHex(unit);
                            if (waitKey) {
                                const srcH = { ...(getHex(srcKey) || {}) };
                                delete srcH.unit;
                                setHex(srcKey, srcH);
                                const waitH = { ...(getHex(waitKey) || {}) };
                                waitH.unit = stopTravel(unit);
                                setHex(waitKey, waitH);
                            } else {
                                const h = { ...(getHex(srcKey) || {}) };
                                h.unit = stopTravel(unit);
                                setHex(srcKey, h);
                            }
                            processedUnits.add(unit.id);
                            continue;
                        }

                        const newUnit = { ...unit };
                        newUnit.state = 'fighting';
                        newUnit.arrivalTime = now;
                        const srcH = { ...(getHex(srcKey) || {}) };
                        srcH.unit = newUnit;
                        setHex(srcKey, srcH);
                        processedUnits.add(unit.id);
                        continue;
                    }

                    // МІЙ юніт на гексі → обхід
                    if (targetUnit && targetUnit.owner === currentUsername) {
                        const waitKey = findWaitingHex(unit);
                        if (waitKey && waitKey !== srcKey) {
                            const srcH = { ...(getHex(srcKey) || {}) };
                            delete srcH.unit;
                            setHex(srcKey, srcH);
                            const waitH = { ...(getHex(waitKey) || {}) };
                            waitH.unit = stopTravel(unit);
                            setHex(waitKey, waitH);
                        } else {
                            const h = { ...(getHex(srcKey) || {}) };
                            h.unit = stopTravel(unit);
                            setHex(srcKey, h);
                        }
                        processedUnits.add(unit.id);
                        continue;
                    }

                    // ВОРОЖА РАТУША (core) → почати бій
                    if (targetHex && targetHex.type === 'core' && targetHex.owner && targetHex.owner !== currentUsername) {
                        const newUnit = { ...unit };
                        newUnit.state = 'fighting';
                        newUnit.arrivalTime = now;
                        const srcH = { ...(getHex(srcKey) || {}) };
                        srcH.unit = newUnit;
                        setHex(srcKey, srcH);
                        processedUnits.add(unit.id);
                        continue;
                    }

                    // Звичайний крок
                    if (isHexOccupiedByUnit(targetKey, unit.id)) {
                        const waitKey = findWaitingHex(unit);
                        if (waitKey && waitKey !== srcKey) {
                            const srcH = { ...(getHex(srcKey) || {}) };
                            delete srcH.unit;
                            setHex(srcKey, srcH);
                            const waitH = { ...(getHex(waitKey) || {}) };
                            waitH.unit = stopTravel(unit);
                            setHex(waitKey, waitH);
                        } else {
                            const h = { ...(getHex(srcKey) || {}) };
                            h.unit = stopTravel(unit);
                            setHex(srcKey, h);
                        }
                        processedUnits.add(unit.id);
                        continue;
                    }

                    const moved = { ...unit };
                    const path = moved.path || [];
                    const nextIndex = (moved.pathIndex || 0) + 1;
                    const existingHexData = targetHex ? { ...targetHex } : {};
                    delete existingHexData.unit;

                    const srcH = { ...(getHex(srcKey) || {}) };
                    delete srcH.unit;
                    setHex(srcKey, srcH);

                    if (nextIndex >= path.length) {
                        existingHexData.unit = stopTravel(moved);
                    } else {
                        moved.pathIndex = nextIndex;
                        moved.targetKey = path[nextIndex];
                        moved.arrivalTime = isOffline ? (unit.arrivalTime + MOVE_STEP_MS) : (now + MOVE_STEP_MS);
                        existingHexData.unit = moved;
                    }
                    setHex(targetKey, existingHexData);
                    processedUnits.add(unit.id);
                }
            }

            // ===== КРОК 3: ФОРМУВАННЯ UPDATES =====
            const updates = {};
            Object.keys(hexUpdates).forEach(k => {
                updates[`world_hexes/${k}`] = hexUpdates[k];
            });

            if (goldBonus) {
                const gSnap = await get(ref(db, `users/${currentUsername}/gold`));
                updates[`users/${currentUsername}/gold`] = (gSnap.exists() ? gSnap.val() : 0) + goldBonus;
            }
            if (Object.keys(updates).length === 0) return { changed: false, messages };
            await update(ref(db), updates);
            return { changed: true, messages };
        }

        function _killUnit(hexUpdates, srcKey, unitId, getHex, setHex, messages) {
            const h = { ...(getHex(srcKey) || {}) };
            if (h.unit && h.unit.id === unitId) {
                delete h.unit;
                setHex(srcKey, h);
                if (messages) messages.push(`💀 Ваш воїн загинув на гексі ${srcKey.replace('_', ';')}`);
            }
        }

        function startGameLoop() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(async () => {
                if (!currentUsername || gameLoopBusy) return;
                gameLoopBusy = true;
                try {
                    await tryRegenerateBarbarians();
                    const res = await processUnits(Date.now(), false);
                    res.messages.forEach(m => alert(m));
                } catch (err) { console.error('Помилка циклу:', err); }
                finally { gameLoopBusy = false; }
            }, 3000);
        }

        async function catchUpOffline() {
            const report = [];
            for (let i = 0; i < 3000; i++) {
                const realNow = Date.now();
                let next = null;
                Object.values(hexWorldData).forEach(h => {
                    if (!h || !h.unit || h.unit.owner !== currentUsername) return;
                    const u = h.unit;
                    if (u.state !== 'moving' && u.state !== 'fighting') return;
                    if (!u.arrivalTime || u.arrivalTime > realNow) return;
                    next = next === null ? u.arrivalTime : Math.min(next, u.arrivalTime);
                });
                if (next === null) break;
                const res = await processUnits(next, true);
                report.push(...res.messages);
                if (!res.changed) break;
                const snap = await get(child(ref(db), 'world_hexes'));
                hexWorldData = snap.exists() ? snap.val() : {};
            }
            if (report.length) alert("Поки вас не було:\n" + report.join("\n"));
        }

// ===== КІНЕЦЬ ЧАСТИНИ 3/4 =====

                // ===== ІНТЕРАКТИВ =====
        function initHexGrid() {
            const svg = document.getElementById('hex-svg');
            svg.innerHTML = '';
            const width = GRID_COLS * HEX_RADIUS * Math.sqrt(3) + HEX_RADIUS * 2;
            const height = GRID_ROWS * HEX_RADIUS * 1.5 + HEX_RADIUS * 2;
            svg.setAttribute('width', width);
            svg.setAttribute('height', height);

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const center = hexToPixel(r, c);
                    const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                    polygon.setAttribute("points", getHexPoints(center.x, center.y, HEX_RADIUS));
                    polygon.setAttribute("class", "hex");
                    polygon.setAttribute("id", `hex-${r}-${c}`);
                    polygon.addEventListener('click', () => { if (isClick) handleHexClick(r, c); });
                    svg.appendChild(polygon);
                }
            }
            resetView();
        }

        function hexToPixel(r, c) { return { x: HEX_RADIUS * Math.sqrt(3) * (c + 0.5 * (r & 1)) + HEX_RADIUS, y: HEX_RADIUS * 1.5 * r + HEX_RADIUS }; }

        function getHexPoints(centerX, centerY, radius) {
            let points = [];
            for (let i = 0; i < 6; i++) {
                const angleRad = Math.PI / 180 * (60 * i - 30);
                points.push(`${(centerX + radius * Math.cos(angleRad)).toFixed(1)},${(centerY + radius * Math.sin(angleRad)).toFixed(1)}`);
            }
            return points.join(" ");
        }

        function updateTransform() { document.getElementById('hex-map-container').style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }

        window.zoomIn = function() { const vp = document.getElementById('hex-grid-viewport'); const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2; const ns = Math.min(2.5, scale + 0.25); panX = cx - (cx - panX) * (ns / scale); panY = cy - (cy - panY) * (ns / scale); scale = ns; updateTransform(); }
        window.zoomOut = function() { const vp = document.getElementById('hex-grid-viewport'); const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2; const ns = Math.max(0.15, scale - 0.25); panX = cx - (cx - panX) * (ns / scale); panY = cy - (cy - panY) * (ns / scale); scale = ns; updateTransform(); }
        window.resetView = function() { const vp = document.getElementById('hex-grid-viewport'); const svg = document.getElementById('hex-svg'); scale = 0.45; panX = (vp.clientWidth - svg.getAttribute('width') * scale) / 2; panY = (vp.clientHeight - svg.getAttribute('height') * scale) / 2; updateTransform(); }

        function setupViewportControls() {
            if (viewportReady) return;
            viewportReady = true;
            const viewport = document.getElementById('hex-grid-viewport');
            const clampScale = (s) => Math.min(Math.max(0.15, s), 2.5);

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const ns = clampScale(scale * (e.deltaY < 0 ? 1.04 : 0.96));
                const rect = viewport.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                panX = mx - (mx - panX) * (ns / scale);
                panY = my - (my - panY) * (ns / scale);
                scale = ns; updateTransform();
            }, { passive: false });

            const pointers = new Map();
            let pinchStartDist = 0, pinchStartScale = 1;

            viewport.addEventListener('pointerdown', (e) => {
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 1) { isDragging = true; isClick = true; dragStartX = e.clientX - panX; dragStartY = e.clientY - panY; }
                else if (pointers.size === 2) {
                    isDragging = false; isClick = false;
                    const [a, b] = [...pointers.values()];
                    pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
                    pinchStartScale = scale;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (!pointers.has(e.pointerId)) return;
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 2) {
                    if (pinchStartDist <= 0) return;
                    const [a, b] = [...pointers.values()];
                    const dist = Math.hypot(a.x - b.x, a.y - b.y);
                    const rect = viewport.getBoundingClientRect();
                    const mx = (a.x + b.x) / 2 - rect.left, my = (a.y + b.y) / 2 - rect.top;
                    const ns = clampScale(pinchStartScale * dist / pinchStartDist);
                    panX = mx - (mx - panX) * (ns / scale);
                    panY = my - (my - panY) * (ns / scale);
                    scale = ns; updateTransform();
                    return;
                }
                if (!isDragging) return;
                const dx = e.clientX - panX - dragStartX, dy = e.clientY - panY - dragStartY;
                if (Math.abs(dx) > 6 || Math.abs(dy) > 6) isClick = false;
                panX = e.clientX - dragStartX; panY = e.clientY - dragStartY;
                updateTransform();
            });

            const endPointer = (e) => {
                pointers.delete(e.pointerId);
                if (pointers.size === 0) isDragging = false;
                else if (pointers.size === 1) {
                    const p = [...pointers.values()][0];
                    dragStartX = p.x - panX; dragStartY = p.y - panY;
                    isDragging = true; isClick = false;
                }
            };
            window.addEventListener('pointerup', endPointer);
            window.addEventListener('pointercancel', endPointer);
            window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isSelectingMoveTarget) cancelMoveMode(); });
        }

        function getNeighbors(r, c) {
            const isOdd = r & 1;
            const directions = isOdd ? [{r: -1, c: 0}, {r: -1, c: 1}, {r: 0, c: -1}, {r: 0, c: 1}, {r: 1, c: 0}, {r: 1, c: 1}] : [{r: -1, c: -1}, {r: -1, c: 0}, {r: 0, c: -1}, {r: 0, c: 1}, {r: 1, c: -1}, {r: 1, c: 0}];
            let neighbors = [];
            directions.forEach(d => {
                const nr = r + d.r, nc = c + d.c;
                if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) neighbors.push({ r: nr, c: nc, key: `${nr}_${nc}` });
            });
            return neighbors;
        }

        function isBridgeAccessible(targetR, targetC) {
            return getNeighbors(targetR, targetC).some(n => { const h = hexWorldData[n.key]; return h && h.owner === currentUsername && h.type !== 'chasm'; });
        }

        function checkDistanceValid(targetR, targetC) {
            const targetKey = `${targetR}_${targetC}`;
            const hex = hexWorldData[targetKey];
            if (hex && hex.type !== 'starter') return false;
            return getNeighbors(targetR, targetC).every(n1 => !hexWorldData[n1.key] || hexWorldData[n1.key].type === 'chasm' || hexWorldData[n1.key].type === 'starter');
        }

        function isMyUnit(hex) { return !!(hex && hex.unit && hex.unit.owner === currentUsername); }

        function getPlayerColor(username) {
            let color = null;
            Object.values(hexWorldData).forEach(h => {
                if (!color && h.owner === username && typeof h.color === 'string' && h.color.length > 0) color = h.color;
            });
            return color || '#3b82f6';
        }

        function findMyUnitById(unitId) {
            if (!unitId) return null;
            let result = null;
            Object.keys(hexWorldData).forEach(k => {
                const h = hexWorldData[k];
                if (h && h.unit && h.unit.owner === currentUsername && h.unit.id === unitId) {
                    result = { key: k, hex: h };
                }
            });
            return result;
        }

        function handleHexClick(r, c) {
            const key = `${r}_${c}`;
            const hexInfo = hexWorldData[key];
            const userHasBaseOnMap = Object.values(hexWorldData).some(h => h && h.owner === currentUsername && h.type === 'core');

            if (isSelectingMoveTarget) {
                if (!movingUnitCoords) { cancelMoveMode(); return; }
                const { r: sr, c: sc } = movingUnitCoords;
                if (sr === r && sc === c) { cancelMoveMode(); return; }
                const targetHex = hexWorldData[`${r}_${c}`];
                if (targetHex && targetHex.type === 'chasm') { alert("Не можна ходити в прірву!"); return; }
                if (isMyUnit(targetHex)) { alert("Там уже стоїть ваш воїн!"); return; }
                const path = findPath(sr, sc, r, c);
                if (!path || path.length === 0) { alert("Шлях не знайдено!"); return; }
                executeUnitMove(sr, sc, r, c, path);
                return;
            }

            if (isMyUnit(hexInfo)) {
                if (activeSelection && activeSelection.key === key && activeSelection.layer === 'unit') openCellForHex(r, c, hexInfo);
                else openUnitModal(r, c, hexInfo);
                return;
            }
            activeSelection = null;

            if (hexInfo && hexInfo.owner === currentUsername) {
                if (hexInfo.type === 'core') openTownHallModal(hexInfo, r, c);
                else openCellForHex(r, c, hexInfo);
                return;
            }

            if (hexInfo && hexInfo.type === 'barbarian_camp') { openTerritoryModal(r, c, hexInfo); return; }

            // ===== НОВЕ 5.30.6: ворожа ратуша =====
            if (hexInfo && hexInfo.type === 'core' && hexInfo.owner && hexInfo.owner !== currentUsername) {
                openEnemyCoreModal(r, c, hexInfo);
                return;
            }

            if (hexInfo && hexInfo.owner && hexInfo.owner !== currentUsername && hexInfo.type !== 'chasm') {
                alert(`Ця територія належить володарю: ${hexInfo.owner}`);
                return;
            }

            if (!userHasBaseOnMap) {
                if (hexInfo && hexInfo.type === 'chasm') { alert('Не можна засновувати базу всередині прірви!'); return; }
                if (!checkDistanceValid(r, c)) { alert('Занадто близько до території іншого гравця!'); return; }
                selectedHexCoords = { r, c };
                openBaseModal();
                return;
            }

            if (hexInfo && hexInfo.type === 'chasm') {
                if (!isBridgeAccessible(r, c)) { alert('Занадто далеко від вашої території!'); return; }
                selectedHexCoords = { r, c };
                openBridgeModal(r, c);
                return;
            }

            const isAdjacentToMyTerritory = getNeighbors(r, c).some(n => hexWorldData[n.key] && hexWorldData[n.key].owner === currentUsername && hexWorldData[n.key].type !== 'chasm');
            if (!isAdjacentToMyTerritory) { alert('Ви можете взаємодіяти лише з територіями, що межують з вашими землями!'); return; }
            selectedHexCoords = { r, c };
            openTerritoryModal(r, c, hexInfo || null);
        }

        function openCellForHex(r, c, hexInfo) {
            activeSelection = { key: `${r}_${c}`, layer: 'cell' };
            if (hexInfo && hexInfo.owner === currentUsername) {
                if (hexInfo.type === 'core') openTownHallModal(hexInfo, r, c);
                else openTerritoryModal(r, c, hexInfo);
            } else {
                hideAllModals();
                alert(`Ваш воїн стоїть на чужій території. Власник: ${hexInfo && hexInfo.owner ? hexInfo.owner : '—'}`);
            }
        }

        function hideAllModals() {
            ['base-modal', 'townhall-modal', 'territory-modal', 'unit-modal', 'enemy-core-modal'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        function openBaseModal() {
            const takenColors = new Set();
            Object.values(hexWorldData).forEach(h => { if (h.color) takenColors.add(h.color.toLowerCase()); });
            selectedColor = null;
            const options = document.querySelectorAll('#color-picker-container .color-option');
            let firstAvailableSelected = false;
            options.forEach(opt => {
                opt.classList.remove('selected', 'disabled');
                const optColor = opt.getAttribute('data-color').toLowerCase();
                if (takenColors.has(optColor)) opt.classList.add('disabled');
                else if (!firstAvailableSelected) { opt.classList.add('selected'); selectedColor = optColor; firstAvailableSelected = true; }
            });
            if (!firstAvailableSelected) { alert("Усі кольори прапорів вже зайняті!"); return; }
            document.getElementById('base-modal').style.display = 'block';
        }

        window.selectColor = function(el) {
            if (el.classList.contains('disabled')) return;
            document.querySelectorAll('#color-picker-container .color-option').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedColor = el.getAttribute('data-color');
        }
        window.closeBaseModal = function() { document.getElementById('base-modal').style.display = 'none'; selectedHexCoords = null; }

        // ===== ОНОВЛЕНО 5.30.6: використовує makeCoreHex =====
        window.confirmBuildBase = async function() {
            if (!selectedHexCoords || !selectedColor) return;
            const { r, c } = selectedHexCoords;
            const updates = {};
            // Використовуємо helper — правильний HP за рівнем (100 для 1 рівня)
            updates[`world_hexes/${r}_${c}`] = makeCoreHex(currentUsername, selectedColor, 1);
            getNeighbors(r, c).forEach(n => {
                if (!hexWorldData[n.key]) updates[`world_hexes/${n.key}`] = { owner: currentUsername, color: selectedColor, type: 'starter', isPurchased: false };
            });
            try { updates[`users/${currentUsername}/lastOnline`] = Date.now(); await update(ref(db), updates); closeBaseModal(); }
            catch (err) { alert('Помилка: ' + err.message); }
        }

        function openTownHallModal(coreHex, r, c) {
            hideAllModals();
            const modal = document.getElementById('townhall-modal');
            const infoContainer = document.getElementById('townhall-info');
            const actionBtnsContainer = document.getElementById('townhall-action-btns');
            const currentLevel = coreHex.level || userTownHallLevel || 1;
            const maxHp = getCoreMaxHp(currentLevel);
            const currentHp = coreHex.hp !== undefined ? coreHex.hp : maxHp;
            let costText = userTownHallLevel === 1 ? "14 золота" : (userTownHallLevel === 2 ? "42 золота" : "—");
            let canUpgrade = userTownHallLevel < 3;
            let totalInc = calculateEffectiveIncome(currentUsername, hexWorldData);
            infoContainer.innerHTML = `<div><b>Рівень ратуші:</b> ${userTownHallLevel}</div><div><b>Міцність (HP):</b> <span style="color: ${currentHp < maxHp/2 ? '#ef4444' : '#34d399'}; font-weight: bold;">${Math.round(currentHp)} / ${maxHp}</span></div><div><b>Урон у відповідь:</b> ${getCoreDmg(userTownHallLevel)}</div><div><b>Чистий дохід:</b> <span style="color: #fbbf24; font-weight: bold;">+${totalInc} золота/хв</span></div>`;
            let btnsHtml = '';
            if (isMyUnit(coreHex) && r !== undefined) btnsHtml += `<button class="btn-move" onclick="switchToUnit(${r}, ${c})">🛡️ Меню воїна</button>`;
            btnsHtml += `<button class="btn-recruit" onclick="recruitClubman()">🪵 Найми воїна (15 💰, -1 утр)</button>`;
            if (currentHp < maxHp) btnsHtml += `<button class="btn-repair" onclick="repairTownHall()">🛠️ Відремонтувати (15 💰)</button>`;
            if (canUpgrade) btnsHtml += `<button class="btn-confirm" onclick="upgradeTownHall()">Прокачати (${costText})</button>`;
            actionBtnsContainer.innerHTML = btnsHtml;
            modal.style.display = 'block';
        }

        window.closeTownHallModal = function() { document.getElementById('townhall-modal').style.display = 'none'; activeSelection = null; }

        // ===== НОВЕ 5.30.6: модалка ворожої ратуші =====
        function openEnemyCoreModal(r, c, coreHex) {
            hideAllModals();
            activeSelection = { key: `${r}_${c}`, layer: 'enemy-core' };
            const modal = document.getElementById('enemy-core-modal');
            const level = coreHex.level || 1;
            const maxHp = getCoreMaxHp(level);
            const hp = coreHex.hp !== undefined ? coreHex.hp : maxHp;
            const dmg = getCoreDmg(level);
            const hpPct = Math.round((hp / maxHp) * 100);

            document.getElementById('enemy-core-card').innerHTML = `
                <div class="info-card">
                    <b>Власник:</b> <span style="color: ${coreHex.color || '#fff'};">${coreHex.owner}</span><br>
                    <b>Рівень:</b> ${level}<br>
                    <b>HP:</b> <span style="color: ${hpPct < 30 ? '#ef4444' : (hpPct < 60 ? '#fbbf24' : '#34d399')}; font-weight: bold;">${Math.round(hp)} / ${maxHp} (${hpPct}%)</span><br>
                    <b>Урон у відповідь:</b> ${dmg}<br>
                    <hr style="border-color: #334155; margin: 6px 0;">
                    <span class="bad">⚠️ При знищенні: всі воїни власника гинуть, гекс + 6 сусідів переходять переможцю, трофей = 50% золота ворога.</span>
                </div>
                <div style="font-size: 11px; color: #94a3b8; margin-top: 6px;">Атака відбувається воїном. Оберіть свого воїна і накажіть йти на цей гекс.</div>
            `;

            let btns = '';
            const hasMyUnitNearby = getNeighbors(r, c).some(n => isMyUnit(hexWorldData[n.key]));
            if (hasMyUnitNearby) {
                btns += `<button class="btn-attack-core" onclick="startAttackCore(${r}, ${c})">⚔️ Атакувати ратушу</button>`;
            } else {
                btns += `<button class="btn-disabled" disabled>Потрібен воїн поруч</button>`;
            }
            btns += `<button class="btn-cancel" onclick="closeEnemyCoreModal()">Закрити</button>`;
            document.getElementById('enemy-core-buttons').innerHTML = btns;
            modal.style.display = 'block';
        }

        window.closeEnemyCoreModal = function() {
            document.getElementById('enemy-core-modal').style.display = 'none';
            activeSelection = null;
        }

        // Почати атаку на ратушу: беремо першого вільного мого воїна поблизу і шлемо на гекс ратуші
        window.startAttackCore = function(r, c) {
            const targetKey = `${r}_${c}`;
            // Знаходимо мого вільного воїна поблизу
            let chosen = null;
            for (const n of getNeighbors(r, c)) {
                const h = hexWorldData[n.key];
                if (!isMyUnit(h)) continue;
                if (h.unit.state !== 'idle') continue;
                chosen = { r: n.r, c: n.c, key: n.key };
                break;
            }
            if (!chosen) { alert("Немає вільного воїна поруч!"); return; }
            // Знаходимо шлях від воїна до ратуші (1 крок)
            const path = findPath(chosen.r, chosen.c, r, c);
            if (!path || path.length === 0) { alert("Шлях не знайдено!"); return; }
            closeEnemyCoreModal();
            executeUnitMove(chosen.r, chosen.c, r, c, path);
        }

        window.repairTownHall = async function() {
            if (userGold < 15) { alert("Недостатньо золота!"); return; }
            let coreKey = null;
            Object.keys(hexWorldData).forEach(k => { if (hexWorldData[k].owner === currentUsername && hexWorldData[k].type === 'core') coreKey = k; });
            if (!coreKey) return;
            const coreHex = hexWorldData[coreKey];
            const maxHp = getCoreMaxHp(coreHex.level || userTownHallLevel || 1);
            const updates = {};
            updates[`world_hexes/${coreKey}/hp`] = maxHp;
            updates[`world_hexes/${coreKey}/maxHp`] = maxHp;
            updates[`users/${currentUsername}/gold`] = userGold - 15;
            updates[`users/${currentUsername}/lastOnline`] = Date.now();
            try { await update(ref(db), updates); alert("Ратушу відремонтовано!"); closeTownHallModal(); } catch (err) { alert(err.message); }
        }

        window.upgradeTownHall = async function() {
            let cost = userTownHallLevel === 1 ? 14 : (userTownHallLevel === 2 ? 42 : 0);
            if (userGold < cost) { alert(`Потрібно ${cost} золота.`); return; }
            try {
                let coreHexKey = null;
                Object.keys(hexWorldData).forEach(k => { if (hexWorldData[k].owner === currentUsername && hexWorldData[k].type === 'core') coreHexKey = k; });
                const newLevel = userTownHallLevel + 1;
                const newMaxHp = getCoreMaxHp(newLevel);
                const updates = {};
                updates[`users/${currentUsername}/gold`] = userGold - cost;
                updates[`users/${currentUsername}/townHallLevel`] = newLevel;
                updates[`users/${currentUsername}/lastOnline`] = Date.now();
                if (coreHexKey) {
                    updates[`world_hexes/${coreHexKey}/level`] = newLevel;
                    updates[`world_hexes/${coreHexKey}/hp`] = newMaxHp;
                    updates[`world_hexes/${coreHexKey}/maxHp`] = newMaxHp;

                closeTownHallModal();

        window.recruitClubman = async function() {
            if (userGold < 15) { alert("Недостатньо золота!"); return; }
            let coreKey = null, coreHex = null;

                const h = hexWorldData[k];

        function openTerritoryModal(r, c, hexInfo) {

            const buttonsContainer = document.getElementById('territory-buttons');

            if (hexInfo && hexInfo.type === 'barbarian_camp') {
                const level = hexInfo.level || 'weak';
                const levelNames = { weak: '🟢 Слабкий', medium: '🟡 Середній', strong: '🔴 Сильний' };
                const cfg = BARBARIAN_LEVELS[level] || BARBARIAN_LEVELS.weak;
                const curHp = hexInfo.unit ? Math.round(hexInfo.unit.hp) : cfg.hp;
                const curDmg = hexInfo.unit ? hexInfo.unit.dmg : cfg.dmg;
                title.innerText = `⛺ Табір (${levelNames[level]})`;
