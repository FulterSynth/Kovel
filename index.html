                cardContainer.innerHTML = cardHtml;
                buttonsContainer.innerHTML = `<button class="btn-cancel" onclick="closeTerritoryModal()">Закрити</button>`;
                modal.style.display = 'block';
                return;
            }

            // ===== НОВЕ 5.30.6: ворожа ратуша через territory-modal =====
            if (hexInfo && hexInfo.type === 'core' && hexInfo.owner && hexInfo.owner !== currentUsername) {
                const level = hexInfo.level || 1;
                const maxHp = getCoreMaxHp(level);
                const hp = hexInfo.hp !== undefined ? hexInfo.hp : maxHp;
                title.innerText = "⚔️ Ворожа Ратуша";
                cardHtml = `<div class="info-card"><b>Власник:</b> ${hexInfo.owner}<br><b>Рівень:</b> ${level}<br><b>HP:</b> ${Math.round(hp)} / ${maxHp}<br><b>Урон:</b> ${getCoreDmg(level)}</div>`;
                cardContainer.innerHTML = cardHtml;
                buttonsContainer.innerHTML = `<button class="btn-cancel" onclick="closeTerritoryModal()">Закрити</button>`;
                modal.style.display = 'block';
                return;
            }

            if (!hexInfo || !hexInfo.owner) {
                title.innerText = "🌍 Придбати гекс";
                cardHtml = `<div class="info-card"><b>Купівля:</b><br>💰 10 золота<br><span class="bad">-2 золота/хв</span><br></div>`;
                actionBtns = `<button class="btn-confirm" onclick="buyTerritory(${r}, ${c})">Купити (10 💰)</button>`;
                cardContainer.innerHTML = cardHtml; buttonsContainer.innerHTML = actionBtns; modal.style.display = 'block';
                return;
            }

            const isStarter = hexInfo.type === 'starter';
            const isBridge = hexInfo.type === 'bridge';
            const isFarm = hexInfo.type === 'farm';
            const isMill = hexInfo.type === 'mill';
            const isPurchased = hexInfo.type === 'purchased';
            const hasMyUnitHere = isMyUnit(hexInfo);
            title.innerText = isBridge ? "🌉 Міст" : "🏗️ Управління";
            cardHtml = `<div class="info-card">${isStarter ? '<span class="good">Безкоштовна земля.</span><br><br>' : ''}${isPurchased ? '<span class="warn">Куплена (-2 💰/хв).</span><br><br>' : ''}${isFarm ? '<b>🌾 Ферма (+1 💰/хв).</b><br><br>' : ''}${isMill ? '<b>🛞🌀 Вітряк.</b><br><br>' : ''}<b>Будівлі:</b><br>🌾 (10 💰) | 🛞🌀 (20 💰)</div>`;
            if (hasMyUnitHere) actionBtns += `<button class="btn-move" onclick="switchToUnit(${r}, ${c})">🛡️ Меню воїна</button>`;
            if (isFarm || isMill) actionBtns += `<button class="btn-demolish" onclick="demolishBuilding(${r}, ${c})">🔨 Знести (5 💰)</button>`;
            else if (!isBridge) actionBtns += `<button class="btn-farm" onclick="buildBuilding(${r}, ${c}, 'farm')">🌾 Ферма (10 💰)</button><button class="btn-mill" onclick="buildBuilding(${r}, ${c}, 'mill')">🛞🌀 Вітряк (20 💰)</button>`;
            cardContainer.innerHTML = cardHtml; buttonsContainer.innerHTML = actionBtns; modal.style.display = 'block';
        }

        window.closeTerritoryModal = function() {
            document.getElementById('territory-modal').style.display = 'none';
            selectedHexCoords = null;
            activeSelection = null;
        }

        // ===== МЕНЮ ВОЇНА =====
        function openUnitModal(r, c, hexInfo) {
            hideAllModals();
            const unitId = hexInfo.unit && hexInfo.unit.id ? hexInfo.unit.id : null;
            activeSelection = { key: `${r}_${c}`, unitId: unitId, layer: 'unit' };
            const u = hexInfo.unit;
            let stateText = '🟢 Готовий';
            if (u.state === 'moving') {
                const totalSteps = (u.path || []).length;
                const currentStep = (u.pathIndex || 0) + 1;
                stateText = `🚶 Рухається (${currentStep}/${totalSteps} крок)`;
            } else if (u.state === 'fighting') stateText = '⚔️ У бою!';

            document.getElementById('unit-card').innerHTML = `<div class="info-card">❤️ <b>HP:</b> ${Math.round(u.hp)} / ${u.maxHp}<br>⚔️ <b>Урон:</b> ${u.dmg}<br><b>Статус:</b> ${stateText}<br><span style="opacity: 0.7;">Утримання: -1 💰/хв</span></div><div style="font-size: 11px; color: #94a3b8;">Клікніть по клітинці ще раз, щоб відкрити її меню.</div>`;

            let btns = '';
            if (u.state === 'idle') {
                btns += `<button class="btn-move" onclick="startMoveUnit(${r}, ${c})">🚶 Перемістити воїна</button>`;
                if (u.hp < u.maxHp) btns += `<button class="btn-heal" onclick="healUnit(${r}, ${c})">💊 Вилікувати (10 💰)</button>`;

                const hexOwner = hexInfo.owner;
                const hexType = hexInfo.type;
                if (hexOwner !== currentUsername) {
                    const blockedByZOC = isHexInEnemyZOC(r, c);

                    if (blockedByZOC) {
                        btns += `<button class="btn-disabled" disabled>🚫 Зона контролю ворога</button>`;
                    } else if (!hexOwner) {
                        btns += `<button class="btn-capture" onclick="captureHex(${r}, ${c})">🌍 Захопити гекс (10 💰)</button>`;
                    } else if (hexType !== 'barbarian_camp' && hexType !== 'core' && !(hexInfo.unit && hexInfo.unit.owner !== currentUsername)) {
                        btns += `<button class="btn-capture-enemy" onclick="captureHex(${r}, ${c})">⚔️ Відвоювати гекс</button>`;
                    }
                }
            } else if (u.state === 'fighting') btns += `<button class="btn-demolish" onclick="retreatUnit(${r}, ${c})">🏃 Відступити</button>`;
            else if (u.state === 'moving') btns += `<button class="btn-demolish" onclick="retreatUnit(${r}, ${c})">↩️ Скасувати рух</button>`;
            btns += `<button class="btn-confirm" onclick="switchToCell(${r}, ${c})">📍 Меню клітинки</button>`;
            document.getElementById('unit-buttons').innerHTML = btns;
            document.getElementById('unit-modal').style.display = 'block';

            clearRouteDots();
            if (u.state === 'moving') {
                const svg = document.getElementById('hex-svg');
                setTimeout(() => renderUnitRouteDots(svg, u, `${r}_${c}`), 30);
            }
        }

        window.closeUnitModal = function() {
            document.getElementById('unit-modal').style.display = 'none';
            activeSelection = null;
            clearRouteDots();
            renderWorldData();
        }

        function refreshUnitModal() {
            const modal = document.getElementById('unit-modal');
            if (!modal || modal.style.display !== 'block' || !activeSelection || activeSelection.layer !== 'unit') return;

            let found = null;
            if (activeSelection.unitId) {
                found = findMyUnitById(activeSelection.unitId);
            }
            if (!found) {
                const h = hexWorldData[activeSelection.key];
                if (isMyUnit(h)) found = { key: activeSelection.key, hex: h };
            }

            if (found) {
                activeSelection.key = found.key;
                const [r, c] = found.key.split('_').map(Number);
                openUnitModal(r, c, found.hex);
                clearRouteDots();
                if (found.hex.unit.state === 'moving') {
                    const svg = document.getElementById('hex-svg');
                    setTimeout(() => renderUnitRouteDots(svg, found.hex.unit, found.key), 30);
                }
            } else {
                modal.style.display = 'none';
                activeSelection = null;
                clearRouteDots();
            }
        }

        window.switchToCell = function(r, c) { const h = hexWorldData[`${r}_${c}`]; if (h) openCellForHex(r, c, h); }
        window.switchToUnit = function(r, c) { const h = hexWorldData[`${r}_${c}`]; if (isMyUnit(h)) openUnitModal(r, c, h); }

        // ===== ЗАХОПЛЕННЯ ГЕКСА =====
        window.captureHex = async function(r, c) {
            const key = `${r}_${c}`;
            const hexInfo = hexWorldData[key];
            const hexOwner = hexInfo ? hexInfo.owner : null;

            if (hexOwner === currentUsername) { alert("Це вже ваш гекс!"); return; }
            if (hexInfo && hexInfo.type === 'chasm') { alert("Не можна захопити прірву!"); return; }
            if (!isMyUnit(hexInfo)) { alert("Тут немає вашого воїна!"); return; }

            if (isHexInEnemyZOC(r, c)) {
                alert("Неможливо захопити: гекс у зоні контролю ворога!");
                return;
            }

            if (!hexInfo || !hexOwner) {
                if (userGold < 10) { alert("Потрібно 10 золота для захоплення нейтрального гекса."); return; }
                const updates = {};
                updates[`world_hexes/${key}`] = {
                    owner: currentUsername,
                    color: getPlayerColor(currentUsername),
                    type: 'purchased',
                    isPurchased: true,
                    unit: hexInfo ? hexInfo.unit : null
                };
                updates[`users/${currentUsername}/gold`] = userGold - 10;
                updates[`users/${currentUsername}/lastOnline`] = Date.now();
                try { await update(ref(db), updates); closeUnitModal(); alert("🌍 Нейтральний гекс захоплено! (-10 золота)"); }
                catch (err) { alert("Помилка захоплення: " + err.message); }
                return;
            }

            if (hexOwner !== currentUsername) {
                const isCamp = hexInfo.type === 'barbarian_camp';
                const isCore = hexInfo.type === 'core';
                if (hexInfo.unit && hexInfo.unit.owner !== currentUsername) { alert("На гексі стоїть ворожий воїн. Спочатку перемагай його в бою!"); return; }
                if (isCamp) { alert("Табір варварів не можна захопити напряму — атакуй його воїном!"); return; }
                if (isCore) { alert("Ворожу ратушу треба руйнувати атакою, а не захопленням!"); return; }
                const updates = {};
                const preservedType = hexInfo.type;
                updates[`world_hexes/${key}`] = {
                    owner: currentUsername,
                    color: getPlayerColor(currentUsername),
                    type: preservedType,
                    isPurchased: hexInfo.isPurchased || false,
                    unit: hexInfo.unit || null
                };
                updates[`users/${currentUsername}/lastOnline`] = Date.now();
                try { await update(ref(db), updates); closeUnitModal(); alert("⚔️ Ворожий гекс відвойовано!"); }
                catch (err) { alert("Помилка захоплення: " + err.message); }
                return;
            }
        }

        window.retreatUnit = async function(r, c) {
            const key = `${r}_${c}`;
            const h = hexWorldData[key];
            if (!isMyUnit(h)) return;
            try { await update(ref(db), { [`world_hexes/${key}/unit`]: stopTravel(h.unit) }); closeUnitModal(); } catch (err) { alert(err.message); }
        }

        window.buyTerritory = async function(r, c) {
            if (userGold < 10) { alert("Потрібно 10 золота."); return; }
            const key = `${r}_${c}`;
            if (hexWorldData[key]) { alert("Зайнято."); closeTerritoryModal(); return; }
            const updates = {};
            updates[`world_hexes/${key}`] = { owner: currentUsername, color: getPlayerColor(currentUsername), type: 'purchased', isPurchased: true };
            updates[`users/${currentUsername}/gold`] = userGold - 10;
            updates[`users/${currentUsername}/lastOnline`] = Date.now();
            try { await update(ref(db), updates); closeTerritoryModal(); alert("Придбано!"); } catch (err) { alert(err.message); }
        }

        window.startMoveUnit = function(r, c) {
            closeUnitModal();
            isSelectingMoveTarget = true;
            movingUnitCoords = { r, c };
            document.getElementById('move-banner').style.display = 'flex';
        }

        window.cancelMoveMode = function() {
            isSelectingMoveTarget = false;
            movingUnitCoords = null;
            document.getElementById('move-banner').style.display = 'none';
            renderWorldData();
        }

        async function executeUnitMove(sr, sc, tr, tc, path) {
            cancelMoveMode();
            const sourceKey = `${sr}_${sc}`;
            const sourceHex = hexWorldData[sourceKey];
            if (!isMyUnit(sourceHex) || sourceHex.unit.state !== 'idle') return;
            const unit = { ...sourceHex.unit, state: 'moving', path: path, pathIndex: 0, targetKey: path[0], arrivalTime: Date.now() + MOVE_STEP_MS, finalTargetKey: `${tr}_${tc}` };
            const updates = {};
            updates[`world_hexes/${sourceKey}/unit`] = unit;
            updates[`users/${currentUsername}/lastOnline`] = Date.now();
            try { await update(ref(db), updates); alert(`Воїн вирушив! Кроків: ${path.length}. Час: ${path.length} хв.`); } catch (err) { alert(err.message); }
        }

        window.healUnit = async function(r, c) {
            if (userGold < 10) { alert("Потрібно 10 золота."); return; }
            const key = `${r}_${c}`;
            const hex = hexWorldData[key];
            if (!isMyUnit(hex)) return;
            const updates = {};
            updates[`world_hexes/${key}/unit`] = { ...hex.unit, hp: hex.unit.maxHp };
            updates[`users/${currentUsername}/gold`] = userGold - 10;
            updates[`users/${currentUsername}/lastOnline`] = Date.now();
            try { await update(ref(db), updates); closeUnitModal(); alert("Вилікувано!"); } catch (err) { alert(err.message); }
        }

        window.buildBuilding = async function(r, c, type) {
            const cost = type === 'farm' ? 10 : 20;
            if (userGold < cost) { alert(`Потрібно ${cost} золота.`); return; }
            const key = `${r}_${c}`;
            const currentHex = hexWorldData[key];
            if (!currentHex || currentHex.owner !== currentUsername) { alert("Це не ваш гекс!"); closeTerritoryModal(); return; }
            const wasPurchased = currentHex.isPurchased === true || currentHex.type === 'purchased';
            const updates = {};
            updates[`world_hexes/${key}`] = { owner: currentUsername, color: currentHex.color || getPlayerColor(currentUsername), type: type, isPurchased: wasPurchased, unit: currentHex.unit || null };
            updates[`users/${currentUsername}/gold`] = userGold - cost;
            updates[`users/${currentUsername}/lastOnline`] = Date.now();
            try { await update(ref(db), updates); closeTerritoryModal(); alert(type === 'farm' ? "🌾 Ферму зведено!" : "🛞🌀 Вітряк зведено!"); } catch (err) { alert(err.message); }
        }

        window.demolishBuilding = async function(r, c) {
            if (userGold < 5) { alert("Потрібно 5 золота."); return; }
            const key = `${r}_${c}`;
            const hexInfo = hexWorldData[key];
            if (!hexInfo || hexInfo.owner !== currentUsername) return;
            const wasPurchased = hexInfo.isPurchased === true;
            const restoredType = wasPurchased ? 'purchased' : 'starter';
            const updates = {};
            updates[`world_hexes/${key}`] = { owner: hexInfo.owner, color: hexInfo.color, type: restoredType, isPurchased: wasPurchased, unit: hexInfo.unit || null };
            updates[`users/${currentUsername}/gold`] = userGold - 5;
            updates[`users/${currentUsername}/lastOnline`] = Date.now();
            try { await update(ref(db), updates); closeTerritoryModal(); alert("🔨 Знесено!"); } catch (err) { alert(err.message); }
        }

        // ===== ЧАТ =====
        const CHAT_MAX_MESSAGES = 100;
        let chatUnreadCount = 0;
        let chatLastSeenTimestamp = 0;
        let chatUnsubscribe = null;
        let chatOpen = false;

        function chatTimestampToTime(ts) {
            const d = new Date(ts);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        window.toggleChat = function() {
            const panel = document.getElementById('chat-panel');
            chatOpen = !chatOpen;
            if (chatOpen) {
                panel.classList.add('open');
                chatUnreadCount = 0;
                updateChatUnreadBadge();
                chatLastSeenTimestamp = Date.now();
                setTimeout(() => { const input = document.getElementById('chat-input'); if (input) input.focus(); scrollChatToBottom(); }, 100);
            } else {
                panel.classList.remove('open');
            }
        }

        function updateChatUnreadBadge() {
            const badge = document.getElementById('chat-unread-badge');
            const btn = document.getElementById('chat-button');
            if (chatUnreadCount > 0) { badge.textContent = chatUnreadCount > 99 ? '99+' : chatUnreadCount; btn.classList.add('has-unread'); }
            else { badge.textContent = '0'; btn.classList.remove('has-unread'); }
        }

        function scrollChatToBottom() {
            const container = document.getElementById('chat-messages');
            if (container) container.scrollTop = container.scrollHeight;
        }

        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-input');
            if (!input || !currentUsername) return;
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            try {
                const newMsgRef = ref(db, 'chat_messages/' + Date.now() + '_' + Math.random().toString(36).substr(2, 4));
                await set(newMsgRef, { author: currentUsername, text: text, time: Date.now() });
            } catch (err) { console.error('Помилка відправки:', err); alert('Не вдалось відправити'); }
        }

        function renderChatMessages(messages) {
            const container = document.getElementById('chat-messages');
            if (!container) return;
            const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
            const sorted = Object.values(messages).sort((a, b) => a.time - b.time);
            const toShow = sorted.slice(-CHAT_MAX_MESSAGES);
            container.innerHTML = toShow.map(m => {
                const isOwn = m.author === currentUsername;
                const cls = isOwn ? 'chat-msg own' : 'chat-msg';
                return `<div class="${cls}"><span class="msg-author">${escapeHtml(m.author)}</span><span class="msg-time">${chatTimestampToTime(m.time)}</span><span class="msg-text">${escapeHtml(m.text)}</span></div>`;
            }).join('');
            if (!chatOpen) {
                const newUnread = toShow.filter(m => m.time > chatLastSeenTimestamp && m.author !== currentUsername).length;
                if (newUnread > chatUnreadCount) { chatUnreadCount = newUnread; updateChatUnreadBadge(); }
            }
            if (wasAtBottom) scrollChatToBottom();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        function startChatListener() {
            if (chatUnsubscribe) chatUnsubscribe();
            chatUnsubscribe = onValue(ref(db, 'chat_messages'), (snapshot) => {
                if (snapshot.exists()) renderChatMessages(snapshot.val());
                else {
                    const container = document.getElementById('chat-messages');
                    if (container) container.innerHTML = '<div style="color:#64748b;text-align:center;padding:20px;font-size:12px;">Чат поки порожній.</div>';
                }
            });
        }

        function stopChatListener() {
            if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
        }

        function listenToWorldData() {
            if (unsubWorld) unsubWorld();
            let renderScheduled = false;
            unsubWorld = onValue(ref(db, 'world_hexes'), (snapshot) => {
                hexWorldData = snapshot.exists() ? snapshot.val() : {};
                if (!renderScheduled) {
                    renderScheduled = true;
                    requestAnimationFrame(() => {
                        renderWorldData();
                        updateIncomeDisplay();
                        refreshUnitModal();
                        if (activeSelection && activeSelection.layer === 'unit') {
                            clearRouteDots();
                            let unit = null, unitKey = null;
                            if (activeSelection.unitId) {
                                const found = findMyUnitById(activeSelection.unitId);
                                if (found) { unit = found.hex.unit; unitKey = found.key; }
                            }
                            if (!unit) {
                                const h = hexWorldData[activeSelection.key];
                                if (isMyUnit(h)) { unit = h.unit; unitKey = activeSelection.key; }
                            }
                            if (unit && unit.state === 'moving') {
                                const svg = document.getElementById('hex-svg');
                                renderUnitRouteDots(svg, unit, unitKey);
                            }
                        }
                        renderScheduled = false;
                    });
                }
            });
        }

        function svgEl(tag, attrs) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
            for (const k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        function renderTownHallVector(svg, center, teamColor, level) {
            const g = svgEl("g", { class: "map-icon" });
            const cx = center.x, cy = center.y;
            g.appendChild(svgEl("ellipse", { cx, cy: cy + 14, rx: 22, ry: 6, fill: "rgba(0,0,0,0.45)" }));
            g.appendChild(svgEl("rect", { x: cx - 18, y: cy - 4, width: 36, height: 18, fill: "#475569", stroke: "#1e293b", "stroke-width": 1.5, rx: 2 }));
            for (let i = 0; i < 6; i++) g.appendChild(svgEl("rect", { x: cx - 16 + (i * 6) % 30, y: cy + 1 + Math.floor(i / 5) * 5, width: 4, height: 3, fill: "#334155", opacity: "0.6" }));
            g.appendChild(svgEl("rect", { x: cx - 8, y: cy - 16, width: 16, height: 14, fill: "#64748b", stroke: "#1e293b", "stroke-width": 1.5 }));
            for (let i = 0; i < 4; i++) g.appendChild(svgEl("rect", { x: cx - 8 + i * 4.5, y: cy - 19, width: 2.5, height: 3, fill: "#64748b", stroke: "#1e293b", "stroke-width": 1 }));
            g.appendChild(svgEl("rect", { x: cx - 20, y: cy - 10, width: 10, height: 10, fill: "#64748b", stroke: "#1e293b", "stroke-width": 1.5 }));
            g.appendChild(svgEl("rect", { x: cx + 10, y: cy - 10, width: 10, height: 10, fill: "#64748b", stroke: "#1e293b", "stroke-width": 1.5 }));
            for (let i = 0; i < 3; i++) {
                g.appendChild(svgEl("rect", { x: cx - 20 + i * 3.5, y: cy - 13, width: 2, height: 3, fill: "#64748b", stroke: "#1e293b", "stroke-width": 1 }));
                g.appendChild(svgEl("rect", { x: cx + 10 + i * 3.5, y: cy - 13, width: 2, height: 3, fill: "#64748b", stroke: "#1e293b", "stroke-width": 1 }));
            }
            g.appendChild(svgEl("path", { d: `M ${cx - 5} ${cy + 14} L ${cx - 5} ${cy + 4} Q ${cx} ${cy - 2} ${cx + 5} ${cy + 4} L ${cx + 5} ${cy + 14} Z`, fill: "#1e293b", stroke: "#0f172a", "stroke-width": 1 }));
            g.appendChild(svgEl("circle", { cx: cx - 14, cy: cy - 5, r: 1.5, fill: "#fbbf24" }));
            g.appendChild(svgEl("circle", { cx: cx + 14, cy: cy - 5, r: 1.5, fill: "#fbbf24" }));
            g.appendChild(svgEl("line", { x1: cx, y1: cy - 19, x2: cx, y2: cy - 30, stroke: "#94a3b8", "stroke-width": 1.5 }));
            g.appendChild(svgEl("path", { d: `M ${cx} ${cy - 30} L ${cx + 11} ${cy - 28} L ${cx} ${cy - 23} Z`, fill: teamColor, stroke: "rgba(0,0,0,0.4)", "stroke-width": 0.8 }));
            g.appendChild(svgEl("circle", { cx: cx + 5, cy: cy - 27.5, r: 1.2, fill: "rgba(255,255,255,0.85)" }));
            if (level >= 2) { const crown = svgEl("text", { x: cx + 14, y: cy - 22, "font-size": "9", "text-anchor": "middle", fill: "#fbbf24" }); crown.textContent = "👑"; g.appendChild(crown); }
            svg.appendChild(g);
        }

        function renderFarmVector(svg, center) {
            const g = svgEl("g", { class: "map-icon" });
            const cx = center.x, cy = center.y;
            g.appendChild(svgEl("ellipse", { cx, cy: cy + 12, rx: 20, ry: 5, fill: "rgba(0,0,0,0.4)" }));
            g.appendChild(svgEl("rect", { x: cx + 4, y: cy - 2, width: 14, height: 12, fill: "#a16207", stroke: "#78350f", "stroke-width": 1, rx: 1 }));

        function renderBattleHPBars(svg) {
            Object.keys(hexWorldData).forEach(key => {
                const h = hexWorldData[key];
                if (!h || !h.unit) return;
                if (h.unit.state !== 'fighting') return;
                if (h.unit.owner !== currentUsername) return;
                const targetKey = h.unit.targetKey;
                if (!targetKey) return;
                const targetHex = hexWorldData[targetKey];
                if (!targetHex) return;

                const [r1, c1] = key.split('_').map(Number);
                const [r2, c2] = targetKey.split('_').map(Number);
                const p1 = hexToPixel(r1, c1);
                const p2 = hexToPixel(r2, c2);

                drawBattleHPBar(svg, p1.x, p1.y - 30, h.unit, "#3b82f6", "Ви");

                // ===== НОВЕ 5.30.6: якщо ціль — ратуша, показуємо її HP =====
                if (targetHex.type === 'core') {
                    const coreLevel = targetHex.level || 1;
                    const coreMaxHp = getCoreMaxHp(coreLevel);
                    const coreCurrentHp = targetHex.hp !== undefined ? targetHex.hp : coreMaxHp;
                    const fakeUnit = { hp: coreCurrentHp, maxHp: coreMaxHp };
                    drawBattleHPBar(svg, p2.x, p2.y - 30, fakeUnit, "#ef4444", "Ратуша");
                } else if (targetHex.unit) {
                    drawBattleHPBar(svg, p2.x, p2.y - 30, targetHex.unit, "#ef4444", "Ворог");
                }
            });
        }

        function drawBattleHPBar(svg, cx, cy, unit, color, label) {
            const barW = 44, barH = 9;
            const bx = cx - barW / 2;
            const by = cy;
            const maxHp = unit.maxHp || 100;
            const pct = Math.max(0, Math.min(1, (unit.hp || 0) / maxHp));
            const labelText = svgEl("text", { x: cx, y: by - 8, class: "battle-hp-label", "font-size": "10" });
            labelText.textContent = label;
            svg.appendChild(labelText);
            svg.appendChild(svgEl("rect", { x: bx, y: by, width: barW, height: barH, rx: barH / 2, class: "battle-hp-bar-bg" }));
            const pctColor = pct > 0.5 ? color : (pct > 0.25 ? '#f59e0b' : '#ef4444');
            svg.appendChild(svgEl("rect", { x: bx + 1, y: by + 1, width: Math.max(0, (barW - 2) * pct), height: barH - 2, rx: (barH - 2) / 2, fill: pctColor, class: "battle-hp-bar-fill" }));
            const hpText = svgEl("text", { x: cx, y: by + barH / 2 + 0.5, class: "battle-hp-label", "font-size": "8" });
            hpText.textContent = `${Math.round(unit.hp)}/${maxHp}`;
            svg.appendChild(hpText);
        }

        function renderUnitRouteDots(svg, unit, currentKey) {
            if (!unit || unit.state !== 'moving') return;
            if (!unit.path || !Array.isArray(unit.path)) return;
            const currentIdx = unit.pathIndex || 0;
            const remainingPath = unit.path.slice(currentIdx);
            if (remainingPath.length === 0) return;
            const g = svgEl("g", { class: "route-dots-group" });
            remainingPath.forEach((key, i) => {
                const [r, c] = key.split('_').map(Number);
                const center = hexToPixel(r, c);
                if (i === 0) g.appendChild(svgEl("circle", { cx: center.x, cy: center.y, r: 7, class: "route-dot-next" }));
                else g.appendChild(svgEl("circle", { cx: center.x, cy: center.y, r: 4, class: "route-dot-path" }));
            });
            svg.appendChild(g);
        }

        function clearRouteDots() {
            document.querySelectorAll('.route-dots-group').forEach(el => el.remove());
        }

        function darkenColor(hex, factor = 0.6) {
            if (!hex || typeof hex !== 'string') return null;
            let h = hex.replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            if (h.length !== 6) return null;
            const num = parseInt(h, 16);
            if (isNaN(num)) return null;
            const r = Math.round(((num >> 16) & 255) * factor);
            const g = Math.round(((num >> 8) & 255) * factor);
            const b = Math.round((num & 255) * factor);
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function renderUnitBadge(svg, cx, cy, r, unit, teamColor, isBarbarian) {
            const k = r / 15;
            const s = k;
            const darkenedTeamColor = darkenColor(teamColor, 0.6) || '#1e293b';

            g.appendChild(svgEl("line", { x1: cx - 2 * s, y1: cy + 4 * s, x2: cx - 3 * s, y2: cy + 9 * s, stroke: '#1e293b', 'stroke-width': 2.2 * s, 'stroke-linecap': 'round' }));
            g.appendChild(svgEl("line", { x1: cx + 2 * s, y1: cy + 4 * s, x2: cx + 3 * s, y2: cy + 9 * s, stroke: '#1e293b', 'stroke-width': 2.2 * s, 'stroke-linecap': 'round' }));

            g.appendChild(svgEl("circle", { cx: cx + 1 * s, cy: cy - 6.5 * s, r: 0.7 * s, fill: '#0f172a' }));
            g.appendChild(svgEl("line", { x1: cx + 3 * s, y1: cy - 1 * s, x2: cx + 6 * s, y2: cy - 6 * s, stroke: teamColor, 'stroke-width': 1.8 * s, 'stroke-linecap': 'round' }));
            g.appendChild(svgEl("line", { x1: cx + 5 * s, y1: cy - 4 * s, x2: cx + 10 * s, y2: cy - 11 * s, stroke: '#6b3410', 'stroke-width': 1.8 * s, 'stroke-linecap': 'round' }));
            g.appendChild(svgEl("ellipse", { cx: cx + 11 * s, cy: cy - 12 * s, rx: 2.5 * s, ry: 3 * s, fill: '#8b4513', stroke: '#4a2008', 'stroke-width': 0.7 * s }));
            g.appendChild(svgEl("polygon", { points: `${cx + 9.5 * s},${cy - 14 * s} ${cx + 8.5 * s},${cy - 16 * s} ${cx + 11 * s},${cy - 15 * s}`, fill: '#94a3b8', stroke: '#475569', 'stroke-width': 0.3 * s }));
            g.appendChild(svgEl("polygon", { points: `${cx + 13 * s},${cy - 14 * s} ${cx + 14.5 * s},${cy - 16 * s} ${cx + 12 * s},${cy - 15 * s}`, fill: '#94a3b8', stroke: '#475569', 'stroke-width': 0.3 * s }));
            g.appendChild(svgEl("polygon", { points: `${cx + 11.5 * s},${cy - 9.5 * s} ${cx + 12 * s},${cy - 7.5 * s} ${cx + 13 * s},${cy - 10 * s}`, fill: '#94a3b8', stroke: '#475569', 'stroke-width': 0.3 * s }));
            if (isBarbarian) {
                g.appendChild(svgEl("rect", { x: cx - 4 * s, y: cy - 3 * s, width: 8 * s, height: 8 * s, fill: 'none', stroke: '#7f1d1d', 'stroke-width': 1 * s, rx: 1.5 * s }));
                g.appendChild(svgEl("polygon", { points: `${cx - 3.5 * s},${cy - 9 * s} ${cx - 5 * s},${cy - 13 * s} ${cx - 2 * s},${cy - 10 * s}`, fill: '#fef3c7', stroke: '#78350f', 'stroke-width': 0.5 * s }));
                g.appendChild(svgEl("polygon", { points: `${cx + 3.5 * s},${cy - 9 * s} ${cx + 5 * s},${cy - 13 * s} ${cx + 2 * s},${cy - 10 * s}`, fill: '#fef3c7', stroke: '#78350f', 'stroke-width': 0.5 * s }));
            }
            const maxHp = unit.maxHp || 100;
            const pct = Math.max(0, Math.min(1, (unit.hp || 0) / maxHp));
            const barW = 18 * k, barH = 3 * k;
            const bx = cx - barW / 2, by = cy + 11 * k;
            g.appendChild(svgEl("rect", { x: bx, y: by, width: barW, height: barH, rx: barH / 2, fill: '#475569' }));
            g.appendChild(svgEl("rect", { x: bx, y: by, width: Math.max(0.1, barW * pct), height: barH, rx: barH / 2, fill: pct > 0.5 ? '#10b981' : (pct > 0.25 ? '#f59e0b' : '#ef4444') }));
            svg.appendChild(g);

        function renderWorldData() {
            const svg = document.getElementById('hex-svg');
            document.querySelectorAll('.map-icon, .owner-label-bg, .owner-label-text, .unit-badge').forEach(el => el.remove());
            document.querySelectorAll('.battle-hp-bar-bg, .battle-hp-bar-fill, .battle-hp-label').forEach(el => el.remove());
            document.querySelectorAll('polygon.hex').forEach(el => {
                el.style.fill = '#1b263b';
                el.style.stroke = '#1b263b';
                el.classList.remove('occupied-core', 'occupied-border', 'chasm-hex', 'bridge-hex', 'zoc-blocked', 'core-under-attack');
            });

            const unitQueue = [];
            const labelQueue = [];

            Object.keys(hexWorldData).forEach(key => {
                const hexData = hexWorldData[key];
                if (!hexData) return;
                const [r, c] = key.split('_');
                const polygon = document.getElementById(`hex-${r}-${c}`);
                if (!polygon) return;
                const center = hexToPixel(parseInt(r), parseInt(c));
                const hasUnit = !!hexData.unit;

                if (hexData.type === 'chasm') { polygon.classList.add('chasm-hex'); return; }

                if (hexData.type === 'barbarian_camp') {
                    const level = hexData.level || 'weak';
                    const bgColors = { weak: "#14532d", medium: "#78350f", strong: "#450a0a" };
                    const borderColors = { weak: "#22c55e", medium: "#f59e0b", strong: "#dc2626" };
                    polygon.style.fill = bgColors[level] || bgColors.weak;
                    polygon.style.stroke = borderColors[level] || borderColors.weak;
                    renderBarbarianCampVector(svg, center, level);
                    if (hasUnit) unitQueue.push({ center, unit: hexData.unit, color: '#dc2626', barbarian: true, big: false });
                    return;
                }

                polygon.style.fill = hexData.color;
                polygon.style.stroke = hexData.color;

                let plain = false;
                if (hexData.type === 'core') {
                    polygon.classList.add('occupied-core');
                    // Пульсація, якщо ратуша під атакою
                    const isUnderAttack = Object.values(hexWorldData).some(h =>
                        h && h.unit && h.unit.state === 'fighting' && h.unit.targetKey === key && h.unit.owner === currentUsername
                    );
                    if (isUnderAttack && hexData.owner !== currentUsername) polygon.classList.add('core-under-attack');
                    renderTownHallVector(svg, center, hexData.color || '#3b82f6', hexData.level || 1);
                    const level = hexData.level || 1;
                    const maxHp = getCoreMaxHp(level);
                    const hp = hexData.hp !== undefined ? hexData.hp : maxHp;
                    const hpPct = Math.round((hp / maxHp) * 100);
                    const hpText = `${Math.round(hp)}/${maxHp} (${hpPct}%)`;
                    labelQueue.push({ center, text: `👑 ${hexData.owner} [L${level}] ❤️ ${hpText}`, damaged: hpPct < 60 });
                } else if (hexData.type === 'bridge') { polygon.classList.add('bridge-hex'); renderBridgeVector(svg, center); }
                else if (hexData.type === 'farm') { polygon.classList.add('occupied-border'); renderFarmVector(svg, center); }
                else if (hexData.type === 'mill') { polygon.classList.add('occupied-border'); renderMillVector(svg, center); }
                else { polygon.classList.add('occupied-border'); plain = true; }

                if (hasUnit) {
                    const isBarb = hexData.unit.type === 'barbarian';
                    const unitColor = isBarb ? '#dc2626' : getPlayerColor(hexData.unit.owner);
                    unitQueue.push({ center, unit: hexData.unit, color: unitColor, barbarian: isBarb, big: plain });
                }
            });

            unitQueue.forEach(u => {
                if (u.big) renderUnitBadge(svg, u.center.x, u.center.y, 15, u.unit, u.color, u.barbarian);
                else renderUnitBadge(svg, u.center.x + 11, u.center.y + 10, 10, u.unit, u.color, u.barbarian);
            });

            if (activeSelection && activeSelection.layer === 'unit') {
                const myHex = hexWorldData[activeSelection.key];
                if (isMyUnit(myHex) && myHex.unit.state === 'idle') {
                    Object.keys(hexWorldData).forEach(k => {
                        const [kr, kc] = k.split('_').map(Number);
                        const poly = document.getElementById(`hex-${kr}-${kc}`);
                        if (!poly) return;
                        if (isHexInEnemyZOC(kr, kc)) {
                            poly.classList.add('zoc-blocked');
                        }
                    });
                }
            }

            renderBattleHPBars(svg);

            labelQueue.forEach(l => renderLabel(svg, l.center, l.text, l.damaged));
        }

        function renderLabel(svg, center, labelContent, damaged) {
            const labelY = center.y - 40;
            const approxWidth = Math.max(70, labelContent.length * 7.2 + 14);
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", center.x - approxWidth / 2);
            rect.setAttribute("y", labelY - 10);
            rect.setAttribute("width", approxWidth);
            rect.setAttribute("height", 20);
            rect.setAttribute("class", "owner-label-bg");
            if (damaged) rect.setAttribute("stroke", "#ef4444");
            svg.appendChild(rect);
            const userText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            userText.setAttribute("x", center.x);
            userText.setAttribute("y", labelY);
            userText.setAttribute("class", damaged ? "owner-label-text core-damaged" : "owner-label-text");
            userText.textContent = labelContent;
            svg.appendChild(userText);
        }

        // ===== НОВЕ 5.30.6: міграція HP старих ратуш при логіні =====
        // Викликаємо після авторизації, коли hexWorldData вже завантажено.
        // Якщо у старих ратуш HP 200 (стара версія) — переписуємо на нові 100/150/300.
        async function migrateCoreHpIfNeeded() {
            if (normalizeCoreHp()) {
                // Знайшли ратуші з неправильним HP — оновлюємо у Firebase
                const updates = {};
                Object.keys(hexWorldData).forEach(key => {
                    const h = hexWorldData[key];
                    if (!h || h.type !== 'core') return;
                    updates[`world_hexes/${key}/hp`] = h.hp;
                    updates[`world_hexes/${key}/maxHp`] = h.maxHp;
                });
                if (Object.keys(updates).length > 0) {
                    try { await update(ref(db), updates); } catch (err) { console.error('Помилка міграції HP ратуш:', err); }
                }
            }
        }

        // Викликаємо міграцію після логіну — з невеликою затримкою, щоб hexWorldData точно завантажився
        // (hexWorldData вже завантажується в handleAuth до initHexGrid)
        // Додаємо виклик у listenToWorldData (перший раз)
        let coreHpMigrated = false;
        function tryMigrateCoreHpOnce() {
            if (coreHpMigrated) return;
            coreHpMigrated = true;
            migrateCoreHpIfNeeded().catch(err => console.error(err));
        }
    </script>
