        async function tryRegenerateBarbarians() {
            const now = Date.now();
            const updates = {};
            let count = 0;
            Object.keys(hexWorldData).forEach(key => {
                const h = hexWorldData[key];
                if (!h || h.type !== 'barbarian_camp' || !h.unit || h.unit.type !== 'barbarian') return;
                if ((now - (h.unit.lastCombat || 0)) > BARBARIAN_REGEN_MS && h.unit.hp < h.unit.maxHp) {
                    updates[`world_hexes/${key}/unit/hp`] = h.unit.maxHp;
                    count++;
                }
            });
            if (count > 0) { try { await update(ref(db), updates); } catch (err) { console.error(err); } }
        }

        // ===== БІЙ ТА РУХ =====
        function stopTravel(unit) {
            const u = { ...unit, state: 'idle' };
            delete u.targetKey; delete u.arrivalTime; delete u.path; delete u.pathIndex; delete u.finalTargetKey;
            return u;
        }

        function findPath(startR, startC, targetR, targetC) {
            const startKey = `${startR}_${startC}`;
            const targetKey = `${targetR}_${targetC}`;
            if (startKey === targetKey) return [];
            const visited = new Set([startKey]);
            const queue = [{ r: startR, c: startC, path: [] }];
            let iterations = 0;
            const MAX_ITER = 20000;

            while (queue.length > 0 && iterations++ < MAX_ITER) {
                const { r, c, path } = queue.shift();
                for (const n of getNeighbors(r, c)) {
                    const key = n.key;
                    if (visited.has(key)) continue;
                    const h = hexWorldData[key];
                    if (h && h.type === 'chasm') continue;
                    if (key !== targetKey && isMyUnit(h)) continue;
                    visited.add(key);
                    const newPath = [...path, key];
                    if (key === targetKey) return newPath;
                    queue.push({ r: n.r, c: n.c, path: newPath });
                }
            }
            return null;
        }

        function computeUnitAfterCombat(winner, isOffline) {
            const path = winner.path || [];
            const nextIndex = (winner.pathIndex || 0) + 1;
            if (nextIndex >= path.length) return stopTravel(winner);
            const next = { ...winner, state: 'moving' };
            next.pathIndex = nextIndex;
            next.targetKey = path[nextIndex];
            next.arrivalTime = isOffline ? (winner.arrivalTime + MOVE_STEP_MS) : (Date.now() + MOVE_STEP_MS);
            return next;
        }

        function continuePathAfterCombat(winner, updates, newHexKey, isOffline) {
            const path = winner.path || [];
            const nextIndex = (winner.pathIndex || 0) + 1;
            const newUnitPath = `world_hexes/${newHexKey}/unit`;
            if (nextIndex >= path.length) {
                updates[newUnitPath] = stopTravel(winner);
            } else {
                updates[newUnitPath] = {
                    ...winner,
                    state: 'moving',
                    pathIndex: nextIndex,
                    targetKey: path[nextIndex],
                    arrivalTime: isOffline ? (winner.arrivalTime + MOVE_STEP_MS) : (Date.now() + MOVE_STEP_MS)
                };
            }
        }

        // ===== ЗОНА КОНТРОЛЮ =====
        function isHexInEnemyZOC(r, c) {
            const targetKey = `${r}_${c}`;
            const neighbors = getNeighbors(r, c);
            const checkHexes = [{ key: targetKey, r, c }, ...neighbors];

            for (const cell of checkHexes) {
                const h = hexWorldData[cell.key];
                if (!h) continue;
                if (!h.unit) continue;
                const unitOwner = h.unit.owner;
                if (!unitOwner) continue;
                if (unitOwner === currentUsername) continue;
                if (unitOwner === '__barbarian__') continue;
                return true;
            }

            for (const cell of checkHexes) {
                const h = hexWorldData[cell.key];
                if (!h) continue;
                if (h.type !== 'core') continue;
                const hexOwner = h.owner;
                if (!hexOwner) continue;
                if (hexOwner === currentUsername) continue;
                return true;
            }

            return false;
        }

        // =====================================================================
        // ВИПРАВЛЕНО v5.30.2:
        // Раніше в одному update() писались і сам гекс (`world_hexes/X_Y`),
        // і його поле (`world_hexes/X_Y/unit`) — Firebase таке забороняє.
        // Тепер стан кожного гекса збирається в hexUpdates і записується
        // ЦІЛКОМ, одним разом — без конфліктів шляхів.
        // =====================================================================
        async function processUnits(now, isOffline = false) {
            const hexUpdates = {};   // key → новий повний об'єкт гекса
            const messages = [];
            const touched = new Set();
            let goldBonus = 0;

            const getHex = (key) => (key in hexUpdates ? hexUpdates[key] : hexWorldData[key]);
            const setHex = (key, obj) => { if (obj === null) hexUpdates[key] = null; else hexUpdates[key] = obj; };

            Object.keys(hexWorldData).forEach(key => {
                const h0 = hexWorldData[key];
                if (!h0 || !h0.unit || h0.unit.owner !== currentUsername) return;
                const unit = h0.unit;
                if (unit.state !== 'moving' && unit.state !== 'fighting') return;
                if (!unit.arrivalTime || now < unit.arrivalTime) return;
                if (touched.has(key)) return;

                const srcKey = key;
                const targetKey = unit.targetKey;

                // Захист: якщо джерело і ціль збігаються — просто зупиняємо воїна
                if (srcKey === targetKey) {
                    const h = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                    h.unit = stopTravel(unit);
                    setHex(srcKey, h);
                    touched.add(srcKey);
                    return;
                }

                const targetHex = getHex(targetKey);
                const targetUnit = targetHex ? targetHex.unit : null;

                // ===== ФАЗА БОЮ =====
                if (unit.state === 'fighting') {
                    if (touched.has(targetKey)) return;
                    touched.add(srcKey); touched.add(targetKey);
                    if (!targetHex || !targetUnit) {
                        const h = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                        h.unit = stopTravel(unit);
                        setHex(srcKey, h);
                        return;
                    }

                    const attacker = { ...unit };
                    const defender = { ...targetUnit };
                    const isCamp = targetHex.type === 'barbarian_camp';
                    defender.hp -= attacker.dmg;
                    attacker.hp -= defender.dmg;
                    if (isCamp) defender.lastCombat = now;

                    if (defender.hp <= 0 && attacker.hp <= 0) {
                        const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                        delete srcH.unit;
                        setHex(srcKey, srcH);
                        if (isCamp) {
                            setHex(targetKey, null);
                        } else {
                            const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                            delete tgtH.unit;
                            setHex(targetKey, tgtH);
                        }
                    } else if (defender.hp <= 0) {
                        const winner = { ...attacker, state: 'moving' };
                        const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                        delete srcH.unit;
                        setHex(srcKey, srcH);

                        if (isCamp) {
                            const reward = targetHex.reward || 100;
                            goldBonus += reward;
                            const finalUnit = computeUnitAfterCombat(winner, isOffline);
                            setHex(targetKey, {
                                owner: currentUsername,
                                color: getPlayerColor(currentUsername),
                                type: 'starter',
                                isPurchased: false,
                                unit: finalUnit
                            });
                            messages.push(`🎉 Табір зачищено! +${reward} золота`);
                        } else {
                            const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                            const path = winner.path || [];
                            const nextIndex = (winner.pathIndex || 0) + 1;
                            const updatedUnit = (nextIndex >= path.length)
                                ? stopTravel(winner)
                                : {
                                    ...winner,
                                    state: 'moving',
                                    pathIndex: nextIndex,
                                    targetKey: path[nextIndex],
                                    arrivalTime: isOffline ? (winner.arrivalTime + MOVE_STEP_MS) : (Date.now() + MOVE_STEP_MS)
                                };
                            tgtH.unit = updatedUnit;
                            setHex(targetKey, tgtH);
                        }
                    } else if (attacker.hp <= 0) {
                        const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                        delete srcH.unit;
                        setHex(srcKey, srcH);
                        const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                        tgtH.unit = defender;
                        setHex(targetKey, tgtH);
                    } else {
                        attacker.state = 'fighting';
                        attacker.arrivalTime = isOffline ? (attacker.arrivalTime + FIGHT_ROUND_MS) : (now + FIGHT_ROUND_MS);
                        const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                        srcH.unit = attacker;
                        setHex(srcKey, srcH);
                        const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                        tgtH.unit = defender;
                        setHex(targetKey, tgtH);
                    }
                    return;
                }

                // ===== ФАЗА РУХУ =====
                if (unit.state === 'moving') {
                    if (targetHex && targetHex.type === 'chasm') {
                        const h = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                        h.unit = stopTravel(unit);
                        setHex(srcKey, h);
                        return;
                    }

                    if (targetUnit && targetUnit.owner !== currentUsername) {
                        if (touched.has(targetKey)) return;
                        touched.add(srcKey); touched.add(targetKey);
                        const attacker = { ...unit };
                        const defender = { ...targetUnit };
                        const isCamp = targetHex.type === 'barbarian_camp';
                        defender.hp -= attacker.dmg;
                        attacker.hp -= defender.dmg;
                        if (isCamp) defender.lastCombat = now;

                        if (defender.hp <= 0 && attacker.hp <= 0) {
                            const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                            delete srcH.unit;
                            setHex(srcKey, srcH);
                            if (isCamp) {
                                setHex(targetKey, null);
                            } else {
                                const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                                delete tgtH.unit;
                                setHex(targetKey, tgtH);
                            }
                        } else if (defender.hp <= 0) {
                            const winner = { ...attacker, state: 'moving' };
                            const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                            delete srcH.unit;
                            setHex(srcKey, srcH);

                            if (isCamp) {
                                const reward = targetHex.reward || 100;
                                goldBonus += reward;
                                const finalUnit = computeUnitAfterCombat(winner, isOffline);
                                setHex(targetKey, {
                                    owner: currentUsername,
                                    color: getPlayerColor(currentUsername),
                                    type: 'starter',
                                    isPurchased: false,
                                    unit: finalUnit
                                });
                                messages.push(`🎉 Табір зачищено! +${reward} золота`);
                            } else {
                                const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                                const path = winner.path || [];
                                const nextIndex = (winner.pathIndex || 0) + 1;
                                const updatedUnit = (nextIndex >= path.length)
                                    ? stopTravel(winner)
                                    : {
                                        ...winner,
                                        state: 'moving',
                                        pathIndex: nextIndex,
                                        targetKey: path[nextIndex],
                                        arrivalTime: isOffline ? (winner.arrivalTime + MOVE_STEP_MS) : (Date.now() + MOVE_STEP_MS)
                                    };
                                tgtH.unit = updatedUnit;
                                setHex(targetKey, tgtH);
                            }
                        } else if (attacker.hp <= 0) {
                            const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                            delete srcH.unit;
                            setHex(srcKey, srcH);
                            const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                            tgtH.unit = defender;
                            setHex(targetKey, tgtH);
                        } else {
                            attacker.state = 'fighting';
                            attacker.arrivalTime = isOffline ? (attacker.arrivalTime + FIGHT_ROUND_MS) : (now + FIGHT_ROUND_MS);
                            const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                            srcH.unit = attacker;
                            setHex(srcKey, srcH);
                            const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                            tgtH.unit = defender;
                            setHex(targetKey, tgtH);
                        }
                        return;
                    }

                    if (targetUnit && targetUnit.owner === currentUsername) {
                        const h = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                        h.unit = stopTravel(unit);
                        setHex(srcKey, h);
                        return;
                    }

                    // ===== ЗНИЩЕННЯ РАТУШІ =====
                    if (targetHex && targetHex.type === 'core' && targetHex.owner && targetHex.owner !== currentUsername) {
                        if (touched.has(targetKey)) return;
                        touched.add(srcKey); touched.add(targetKey);
                        const attacker = { ...unit };
                        let coreHp = targetHex.hp !== undefined ? targetHex.hp : 200;
                        coreHp -= attacker.dmg;
                        attacker.hp -= 30;

                        if (coreHp <= 0) {
                            const myColor = getPlayerColor(currentUsername);
                            const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                            delete srcH.unit;
                            setHex(srcKey, srcH);

                            setHex(targetKey, {
                                owner: currentUsername,
                                color: myColor,
                                type: 'purchased',
                                isPurchased: true,
                                unit: stopTravel(attacker)
                            });

                            const [tR, tC] = targetKey.split('_').map(Number);
                            const neighbors = getNeighbors(tR, tC);
                            neighbors.forEach(n => {
                                const nHex = getHex(n.key);
                                if (!nHex) return;
                                if (nHex.type === 'chasm') return;
                                if (nHex.owner === currentUsername) return;
                                const newObj = { ...nHex };
                                newObj.owner = currentUsername;
                                newObj.color = myColor;
                                newObj.isPurchased = nHex.isPurchased || true;
                                setHex(n.key, newObj);
                                touched.add(n.key);
                            });
                            messages.push("💥 Ратушу ворога знищено! Сусідні гекси переходять до тебе!");
                        } else if (attacker.hp <= 0) {
                            const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                            delete srcH.unit;
                            setHex(srcKey, srcH);
                            const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                            tgtH.hp = coreHp;
                            setHex(targetKey, tgtH);
                        } else {
                            attacker.state = 'fighting';
                            attacker.arrivalTime = isOffline ? (attacker.arrivalTime + FIGHT_ROUND_MS) : (now + FIGHT_ROUND_MS);
                            const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                            srcH.unit = attacker;
                            setHex(srcKey, srcH);
                            const tgtH = getHex(targetKey) ? { ...getHex(targetKey) } : {};
                            tgtH.hp = coreHp;
                            setHex(targetKey, tgtH);
                        }
                        return;
                    }

                    // ===== ЗВИЧАЙНИЙ КРОК =====
                    const moved = { ...unit };
                    const path = moved.path || [];
                    const nextIndex = (moved.pathIndex || 0) + 1;
                    const existingHexData = targetHex ? { ...targetHex } : {};
                    delete existingHexData.unit;

                    const srcH = getHex(srcKey) ? { ...getHex(srcKey) } : {};
                    delete srcH.unit;
                    setHex(srcKey, srcH);

                    if (nextIndex >= path.length) {
                        existingHexData.unit = stopTravel(moved);
                    } else {
                        moved.pathIndex = nextIndex;
                        moved.targetKey = path[nextIndex];
                        moved.arrivalTime = isOffline ? (unit.arrivalTime + MOVE_STEP_MS) : (now + MOVE_STEP_MS);
                        existingHexData.unit = moved;
                    }
                    setHex(targetKey, existingHexData);
                    touched.add(srcKey); touched.add(targetKey);
                    return;
                }
            });

            // Формуємо фінальний updates для Firebase
            const updates = {};
            Object.keys(hexUpdates).forEach(k => {
                updates[`world_hexes/${k}`] = hexUpdates[k];
            });

            if (goldBonus) {
                const gSnap = await get(ref(db, `users/${currentUsername}/gold`));
                updates[`users/${currentUsername}/gold`] = (gSnap.exists() ? gSnap.val() : 0) + goldBonus;
            }
            if (Object.keys(updates).length === 0) return { changed: false, messages };
            await update(ref(db), updates);
            return { changed: true, messages };
        }

        function startGameLoop() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(async () => {
                if (!currentUsername || gameLoopBusy) return;
                gameLoopBusy = true;
                try {
                    await tryRegenerateBarbarians();
                    const res = await processUnits(Date.now(), false);
                    res.messages.forEach(m => alert(m));
                } catch (err) { console.error('Помилка циклу:', err); }
                finally { gameLoopBusy = false; }
            }, 3000);
        }

        async function catchUpOffline() {
            const report = [];
            for (let i = 0; i < 3000; i++) {
                const realNow = Date.now();
                let next = null;
                Object.values(hexWorldData).forEach(h => {
                    if (!h || !h.unit || h.unit.owner !== currentUsername) return;
                    const u = h.unit;
                    if (u.state !== 'moving' && u.state !== 'fighting') return;
                    if (!u.arrivalTime || u.arrivalTime > realNow) return;
                    next = next === null ? u.arrivalTime : Math.min(next, u.arrivalTime);
                });
                if (next === null) break;
                const res = await processUnits(next, true);
                report.push(...res.messages);
                if (!res.changed) break;
                const snap = await get(child(ref(db), 'world_hexes'));
                hexWorldData = snap.exists() ? snap.val() : {};
            }
            if (report.length) alert("Поки вас не було:\n" + report.join("\n"));
        }
